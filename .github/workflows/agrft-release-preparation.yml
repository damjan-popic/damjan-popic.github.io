name: Prepare AGRFT 1.2
on:
  push:
    branches: [agrft-pronunciation-v1.2]
    paths: [scripts/agrft_release/READY]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agrft-pronunciation-v1.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble and validate the approved course revision
        run: |
          python scripts/agrft_release/apply.py
          python -m pip install -r requirements.txt
          python scripts/check_course_packages.py
          python -m unittest discover -s . -p 'test_*.py'
          python build.py --output _site
      - name: Commit validated material on the preparation branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/en/teaching/agrft.md content/sl/poucevanje/agrft.md assets/files docs/AGRFT_CHANGELOG.md scripts/agrft_release .github/workflows/agrft-release-preparation.yml
          git commit -m 'Publish AGRFT 1.2: pronunciation, word practice and individual drills'
          git push origin HEAD:agrft-pronunciation-v1.2
      - name: Save the reviewed release files
        uses: actions/upload-artifact@v4
        with:
          name: agrft-1.2-reviewed
          path: |
            content/en/teaching/agrft.md
            content/sl/poucevanje/agrft.md
            assets/files/AGRFT_English_ucno_gradivo_v1.2.*
            docs/AGRFT_CHANGELOG.md
          retention-days: 7
