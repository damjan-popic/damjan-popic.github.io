name: Publish personal website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out personal website
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Inspect Pages hosting configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{status,build_type,html_url,cname,public,source,https_enforced}'
      - name: Check anonymous delivery before publishing
        run: python scripts/check_delivery.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test website
        run: python -m unittest discover -s . -p 'test_*.py'
      - name: Build standalone website
        run: python build.py --output _site
      - name: Check artifact entry points
        run: |
          test -s _site/index.html
          test -s _site/sl/index.html
          test -s _site/en/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy personal website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check out sources for public-page checks
        uses: actions/checkout@v6
      - name: Verify live Slovenian and English pages
        run: python scripts/check_live.py --expected-commit "$GITHUB_SHA"

  verify:
    name: Anonymous delivery (${{ matrix.os }})
    needs: deploy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Check out the deployed sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check ordinary browser requests and uncached URLs
        run: python scripts/check_delivery.py --strict --attempts 4
      - name: Verify content and photograph from this runner
        run: python scripts/check_live.py --expected-commit "${{ github.sha }}"
