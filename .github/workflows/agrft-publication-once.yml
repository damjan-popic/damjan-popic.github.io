name: Prepare AGRFT 1.2
on:
  push:
    branches: ['publish/agrft-pronunciation-1.2']
    paths: ['.agrft-publish/READY']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble verified course files
        run: |
          python .agrft-publish/assemble.py
          python .agrft-publish/fix-links.py
      - name: Install website dependencies
        run: python -m pip install -r requirements.txt
      - name: Check course packages and website
        run: |
          python scripts/check_course_packages.py
          python -m unittest discover -s . -p 'test_*.py'
          python build.py --output _site
      - name: Keep only publication content
        run: |
          rm -rf .agrft-publish
          rm .github/workflows/agrft-publication-once.yml
          git add content/en/teaching/agrft.md content/sl/poucevanje/agrft.md assets/files/AGRFT_English_ucno_gradivo_v1.2.md assets/files/AGRFT_English_ucno_gradivo_v1.2.zip docs/AGRFT_CHANGELOG.md
          git add -u .agrft-publish .github/workflows/agrft-publication-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish AGRFT 1.2: pronunciation, word bank and individual practice'
          git push origin HEAD:publish/agrft-pronunciation-1.2
