<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="970" viewBox="0 0 1080 970" role="img" aria-labelledby="title desc"><title id="title">From instruction bytes to a computed result</title><desc id="desc">Functional data paths of a fully specified teaching processor: PC or operand selects byte memory address, instruction register holds fetched bytes, decoder controls an ALU and accumulator, accumulator writes back to memory.</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#192c3b"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#086fa0"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85d13"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#74479a"/></marker></defs><style>text{font-family:Arial,DejaVu Sans,sans-serif}path,line{stroke-linecap:round}</style><rect width="1080" height="970" fill="white"/><text x="35" y="44" font-size="28" fill="#192c3b" text-anchor="start" font-weight="700">From instruction bytes to a computed result</text><text x="35" y="83" font-size="20" fill="#536777" text-anchor="start" font-weight="400">Invented 8-bit accumulator machine; two-byte instructions; 256-byte shared memory.</text><rect x="50" y="155" width="225" height="120" rx="8" fill="#f6fafc" stroke="#086fa0" stroke-width="1.8"/><text x="162.5" y="186" font-size="22" fill="#086fa0" text-anchor="middle" font-weight="700">Memory</text><text x="162.5" y="215" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">256 × 8-bit bytes</text><text x="162.5" y="239" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Instructions + data</text><rect x="410" y="155" width="240" height="120" rx="8" fill="#f6fafc" stroke="#086fa0" stroke-width="1.8"/><text x="530" y="186" font-size="22" fill="#086fa0" text-anchor="middle" font-weight="700">Instruction register</text><text x="530" y="215" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">16 bits: opcode byte</text><text x="530" y="239" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">plus operand byte</text><line x1="275" y1="212" x2="410" y2="212" stroke="#086fa0" stroke-width="3" marker-end="url(#blue)"/><text x="343" y="191" font-size="18" fill="#086fa0" text-anchor="middle" font-weight="400">8-bit fetch</text><rect x="795" y="155" width="230" height="120" rx="8" fill="#f6fafc" stroke="#74479a" stroke-width="1.8"/><text x="910" y="186" font-size="22" fill="#74479a" text-anchor="middle" font-weight="700">Control unit</text><text x="910" y="215" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Decode opcode</text><text x="910" y="239" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Sequence operations</text><line x1="650" y1="202" x2="795" y2="202" stroke="#74479a" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#purple)"/><text x="718" y="183" font-size="18" fill="#74479a" text-anchor="middle" font-weight="400">opcode</text><rect x="55" y="397" width="225" height="105" rx="8" fill="#f6fafc" stroke="#086fa0" stroke-width="1.8"/><text x="167.5" y="428" font-size="22" fill="#086fa0" text-anchor="middle" font-weight="700">Address selector</text><text x="167.5" y="457" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">PC / PC+1 / operand</text><line x1="165" y1="397" x2="165" y2="275" stroke="#086fa0" stroke-width="3" marker-end="url(#blue)"/><text x="180" y="340" font-size="18" fill="#086fa0" text-anchor="start" font-weight="400">8-bit address</text><rect x="55" y="610" width="225" height="95" rx="8" fill="#f6fafc" stroke="#086fa0" stroke-width="1.8"/><text x="167.5" y="641" font-size="22" fill="#086fa0" text-anchor="middle" font-weight="700">Program counter</text><text x="167.5" y="670" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">PC: 8 bits</text><line x1="165" y1="610" x2="165" y2="502" stroke="#086fa0" stroke-width="3" marker-end="url(#blue)"/><text x="185" y="566" font-size="18" fill="#086fa0" text-anchor="start" font-weight="400">PC</text><path d="M 485 275 V 347 H 332 V 450 H 280" fill="none" stroke="#086fa0" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/><text x="355" y="327" font-size="18" fill="#086fa0" text-anchor="start" font-weight="400">operand address</text><rect x="420" y="420" width="230" height="100" rx="8" fill="#f6fafc" stroke="#0f766e" stroke-width="1.8"/><text x="535" y="451" font-size="22" fill="#0f766e" text-anchor="middle" font-weight="700">ALU / result mux</text><text x="535" y="480" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Add or select operand</text><rect x="785" y="420" width="230" height="100" rx="8" fill="#f6fafc" stroke="#0f766e" stroke-width="1.8"/><text x="900" y="451" font-size="22" fill="#0f766e" text-anchor="middle" font-weight="700">Accumulator A</text><text x="900" y="480" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">8-bit retained value</text><line x1="650" y1="470" x2="785" y2="470" stroke="#0f766e" stroke-width="3" marker-end="url(#green)"/><text x="715" y="449" font-size="18" fill="#0f766e" text-anchor="middle" font-weight="400">result</text><path d="M 560 275 V 420" fill="none" stroke="#086fa0" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/><text x="577" y="382" font-size="18" fill="#086fa0" text-anchor="start" font-weight="400">immediate</text><path d="M 900 520 V 578 H 510 V 520" fill="none" stroke="#0f766e" stroke-width="3" stroke-linejoin="round" marker-end="url(#green)"/><text x="703" y="603" font-size="18" fill="#0f766e" text-anchor="middle" font-weight="400">A supplies an ALU operand</text><path d="M 1015 470 H 1042 V 113 H 25 V 235 H 50" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#green)"/><text x="665" y="107" font-size="18" fill="#0f766e" text-anchor="middle" font-weight="400">A → memory data input for STA</text><text x="425" y="684" font-size="19" fill="#74479a" text-anchor="start" font-weight="400">Control outputs (purple, not individually routed):</text><text x="425" y="712" font-size="19" fill="#74479a" text-anchor="start" font-weight="400">memory read/write; instruction-byte capture;</text><text x="425" y="740" font-size="19" fill="#74479a" text-anchor="start" font-weight="400">address selection; ALU select; A load; PC advance; halt.</text><text x="35" y="811" font-size="20" fill="#536777" text-anchor="start" font-weight="400">Program bytes: 10 0D | 20 07 | 30 80 | F0 00</text><text x="35" y="841" font-size="20" fill="#536777" text-anchor="start" font-weight="400">Meaning: load 13; add 7; store at address 128; halt.</text><text x="35" y="871" font-size="20" fill="#536777" text-anchor="start" font-weight="400">Final state: A = 20, memory[0x80] = 0x14, PC = 0x06.</text><text x="35" y="901" font-size="20" fill="#536777" text-anchor="start" font-weight="400">Clock and reset distribute to the sequential blocks; the controller handles multi-step fetches.</text></svg>
