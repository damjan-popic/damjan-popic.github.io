<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="910" viewBox="0 0 1080 910" role="img" aria-labelledby="title desc"><title id="title">From air pressure to stored samples and back</title><desc id="desc">Acquisition chain microphone preamplifier analogue anti alias filtering ADC; PCM buffering encoding and storage; decoding and clocked DAC reconstruction amplification and loudspeaker playback.</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#192c3b"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#086fa0"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85d13"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#74479a"/></marker></defs><style>text{font-family:Arial,DejaVu Sans,sans-serif}path,line{stroke-linecap:round}</style><rect width="1080" height="910" fill="white"/><text x="35" y="44" font-size="28" fill="#192c3b" text-anchor="start" font-weight="700">From air pressure to stored samples and back</text><text x="35" y="81" font-size="19" fill="#536777" text-anchor="start" font-weight="400">Functional stages: devices can combine several blocks. Blue = analogue; green = samples/data.</text><rect x="35" y="160" width="215" height="113" rx="8" fill="#f6fafc" stroke="#086fa0" stroke-width="1.8"/><text x="142.5" y="191" font-size="22" fill="#086fa0" text-anchor="middle" font-weight="700">Microphone</text><text x="142.5" y="220" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Pressure → voltage</text><line x1="250" y1="214" x2="300" y2="214" stroke="#086fa0" stroke-width="3" marker-end="url(#blue)"/><rect x="300" y="160" width="215" height="113" rx="8" fill="#f6fafc" stroke="#086fa0" stroke-width="1.8"/><text x="407.5" y="191" font-size="22" fill="#086fa0" text-anchor="middle" font-weight="700">Preamplifier</text><text x="407.5" y="220" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Analogue gain</text><line x1="515" y1="214" x2="565" y2="214" stroke="#086fa0" stroke-width="3" marker-end="url(#blue)"/><rect x="565" y="160" width="215" height="113" rx="8" fill="#f6fafc" stroke="#086fa0" stroke-width="1.8"/><text x="672.5" y="191" font-size="22" fill="#086fa0" text-anchor="middle" font-weight="700">Anti-alias filter</text><text x="672.5" y="220" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Restrict bandwidth</text><line x1="780" y1="214" x2="830" y2="214" stroke="#086fa0" stroke-width="3" marker-end="url(#blue)"/><rect x="830" y="160" width="215" height="113" rx="8" fill="#f6fafc" stroke="#0f766e" stroke-width="1.8"/><text x="937.5" y="191" font-size="22" fill="#0f766e" text-anchor="middle" font-weight="700">ADC</text><text x="937.5" y="220" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Sample + quantise</text><text x="35" y="140" font-size="22" fill="#086fa0" text-anchor="start" font-weight="700">RECORDING</text><text x="760" y="311" font-size="18" fill="#0f766e" text-anchor="middle" font-weight="400">digital samples</text><rect x="560" y="365" width="220" height="105" rx="8" fill="#f6fafc" stroke="#0f766e" stroke-width="1.8"/><text x="670" y="396" font-size="22" fill="#0f766e" text-anchor="middle" font-weight="700">PCM buffers</text><text x="670" y="425" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Sample values + timing</text><path d="M 890 273 V 327 H 670 V 365" fill="none" stroke="#0f766e" stroke-width="3" stroke-linejoin="round" marker-end="url(#green)"/><rect x="250" y="365" width="245" height="105" rx="8" fill="#f6fafc" stroke="#0f766e" stroke-width="1.8"/><text x="372.5" y="396" font-size="22" fill="#0f766e" text-anchor="middle" font-weight="700">Encoder / container</text><text x="372.5" y="425" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Coding + file structure</text><line x1="560" y1="419" x2="495" y2="419" stroke="#0f766e" stroke-width="3" marker-end="url(#green)"/><rect x="35" y="365" width="160" height="105" rx="8" fill="#f6fafc" stroke="#0f766e" stroke-width="1.8"/><text x="115" y="396" font-size="22" fill="#0f766e" text-anchor="middle" font-weight="700">Stored file</text><text x="115" y="425" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Data + metadata</text><line x1="250" y1="419" x2="195" y2="419" stroke="#0f766e" stroke-width="3" marker-end="url(#green)"/><rect x="35" y="580" width="215" height="100" rx="8" fill="#f6fafc" stroke="#0f766e" stroke-width="1.8"/><text x="142.5" y="611" font-size="22" fill="#0f766e" text-anchor="middle" font-weight="700">Decoder</text><text x="142.5" y="640" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Recovers PCM</text><line x1="142" y1="470" x2="142" y2="580" stroke="#0f766e" stroke-width="3" marker-end="url(#green)"/><rect x="300" y="580" width="215" height="100" rx="8" fill="#f6fafc" stroke="#086fa0" stroke-width="1.8"/><text x="407.5" y="611" font-size="22" fill="#086fa0" text-anchor="middle" font-weight="700">DAC + filtering</text><text x="407.5" y="640" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Interpolation /</text><text x="407.5" y="664" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">reconstruction</text><rect x="565" y="580" width="215" height="100" rx="8" fill="#f6fafc" stroke="#086fa0" stroke-width="1.8"/><text x="672.5" y="611" font-size="22" fill="#086fa0" text-anchor="middle" font-weight="700">Power amplifier</text><text x="672.5" y="640" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Voltage + current</text><text x="672.5" y="664" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">for the load</text><rect x="830" y="580" width="215" height="100" rx="8" fill="#f6fafc" stroke="#086fa0" stroke-width="1.8"/><text x="937.5" y="611" font-size="22" fill="#086fa0" text-anchor="middle" font-weight="700">Loudspeaker</text><text x="937.5" y="640" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Motion → pressure</text><line x1="250" y1="630" x2="300" y2="630" stroke="#0f766e" stroke-width="3" marker-end="url(#green)"/><line x1="515" y1="630" x2="565" y2="630" stroke="#086fa0" stroke-width="3" marker-end="url(#blue)"/><line x1="780" y1="630" x2="830" y2="630" stroke="#086fa0" stroke-width="3" marker-end="url(#blue)"/><text x="35" y="558" font-size="22" fill="#086fa0" text-anchor="start" font-weight="700">PLAYBACK</text><rect x="830" y="365" width="215" height="105" rx="8" fill="#f6fafc" stroke="#74479a" stroke-width="1.8"/><text x="937.5" y="396" font-size="22" fill="#74479a" text-anchor="middle" font-weight="700">Timing reference</text><text x="937.5" y="425" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">ADC / DAC clocks</text><line x1="938" y1="365" x2="938" y2="273" stroke="#74479a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#purple)"/><path d="M 865 470 V 517 H 407 V 580" fill="none" stroke="#74479a" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#purple)"/><text x="35" y="746" font-size="19" fill="#536777" text-anchor="start" font-weight="400">Storage does not have a playback sample clock; presentation requires the correct sample timing.</text><text x="35" y="776" font-size="19" fill="#536777" text-anchor="start" font-weight="400">The drawing does not require recording and playback to use one physical clock.</text><text x="35" y="806" font-size="19" fill="#536777" text-anchor="start" font-weight="400">Modern converters may contain oversampling, noise shaping and digital filtering internally.</text><text x="35" y="836" font-size="19" fill="#536777" text-anchor="start" font-weight="400">A DAC’s held or switched electrical output is filtered; the reconstructed waveform is continuous.</text></svg>
