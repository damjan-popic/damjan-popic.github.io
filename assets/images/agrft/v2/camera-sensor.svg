<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="935" viewBox="0 0 1080 935" role="img" aria-labelledby="title desc"><title id="title">From photons to a digital code and reconstructed colour</title><desc id="desc">Invented photodiode charge readout and ADC calculation giving code two hundred fifty, plus a four-by-four Bayer filter mosaic and conceptual demosaicing of single filtered measurements into RGB components.</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#192c3b"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#086fa0"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85d13"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#74479a"/></marker></defs><style>text{font-family:Arial,DejaVu Sans,sans-serif}path,line{stroke-linecap:round}</style><rect width="1080" height="935" fill="white"/><text x="35" y="44" font-size="28" fill="#192c3b" text-anchor="start" font-weight="700">From photons to a digital code and reconstructed colour</text><text x="35" y="83" font-size="19" fill="#536777" text-anchor="start" font-weight="400">Functional single-site example before colour reconstruction. All numerical specifications are invented.</text><rect x="35" y="140" width="215" height="140" rx="8" fill="#f6fafc" stroke="#b85d13" stroke-width="1.8"/><text x="142.5" y="171" font-size="22" fill="#b85d13" text-anchor="middle" font-weight="700">Filtered photons</text><text x="142.5" y="200" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Mean 5,000 photons</text><text x="142.5" y="224" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Quantum efficiency 0.5</text><line x1="250" y1="205" x2="300" y2="205" stroke="#192c3b" stroke-width="2.5" marker-end="url(#ink)"/><rect x="300" y="140" width="215" height="140" rx="8" fill="#f6fafc" stroke="#0f766e" stroke-width="1.8"/><text x="407.5" y="171" font-size="22" fill="#0f766e" text-anchor="middle" font-weight="700">Collected charge</text><text x="407.5" y="200" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Mean 2,500 electrons</text><text x="407.5" y="224" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">100 µV per electron</text><line x1="515" y1="205" x2="565" y2="205" stroke="#192c3b" stroke-width="2.5" marker-end="url(#ink)"/><rect x="565" y="140" width="215" height="140" rx="8" fill="#f6fafc" stroke="#086fa0" stroke-width="1.8"/><text x="672.5" y="171" font-size="22" fill="#086fa0" text-anchor="middle" font-weight="700">Readout voltage</text><text x="672.5" y="200" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Expected 0.250 V</text><text x="672.5" y="224" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">ADC span: 1.024 V</text><line x1="780" y1="205" x2="830" y2="205" stroke="#192c3b" stroke-width="2.5" marker-end="url(#ink)"/><rect x="830" y="140" width="215" height="140" rx="8" fill="#f6fafc" stroke="#74479a" stroke-width="1.8"/><text x="937.5" y="171" font-size="22" fill="#74479a" text-anchor="middle" font-weight="700">10-bit code</text><text x="937.5" y="200" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">1 mV bins; floor model</text><text x="937.5" y="224" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">250 = 0011111010</text><text x="35" y="332" font-size="20" fill="#536777" text-anchor="start" font-weight="400">Nominal calculation: 5,000 × 0.5 × 100 µV = 0.250 V; 0.250 V / 0.001 V = code 250.</text><text x="35" y="362" font-size="20" fill="#536777" text-anchor="start" font-weight="400">Shot noise and read noise make individual measurements vary around the expectation.</text><text x="35" y="392" font-size="20" fill="#536777" text-anchor="start" font-weight="400">A code at one colour-filtered site is not yet a complete RGB output pixel.</text><text x="35" y="471" font-size="24" fill="#192c3b" text-anchor="start" font-weight="700">Example Bayer colour-filter array</text><rect x="100" y="520" width="65" height="65" rx="0" fill="#f9d7cf" stroke="white" stroke-width="1.8"/><text x="132.5" y="560.3" font-size="25" fill="#192c3b" text-anchor="middle" font-weight="700">R</text><rect x="165" y="520" width="65" height="65" rx="0" fill="#d2e9dc" stroke="white" stroke-width="1.8"/><text x="197.5" y="560.3" font-size="25" fill="#192c3b" text-anchor="middle" font-weight="700">G</text><rect x="230" y="520" width="65" height="65" rx="0" fill="#f9d7cf" stroke="white" stroke-width="1.8"/><text x="262.5" y="560.3" font-size="25" fill="#192c3b" text-anchor="middle" font-weight="700">R</text><rect x="295" y="520" width="65" height="65" rx="0" fill="#d2e9dc" stroke="white" stroke-width="1.8"/><text x="327.5" y="560.3" font-size="25" fill="#192c3b" text-anchor="middle" font-weight="700">G</text><rect x="100" y="585" width="65" height="65" rx="0" fill="#d2e9dc" stroke="white" stroke-width="1.8"/><text x="132.5" y="625.3" font-size="25" fill="#192c3b" text-anchor="middle" font-weight="700">G</text><rect x="165" y="585" width="65" height="65" rx="0" fill="#d4e2f4" stroke="white" stroke-width="1.8"/><text x="197.5" y="625.3" font-size="25" fill="#192c3b" text-anchor="middle" font-weight="700">B</text><rect x="230" y="585" width="65" height="65" rx="0" fill="#d2e9dc" stroke="white" stroke-width="1.8"/><text x="262.5" y="625.3" font-size="25" fill="#192c3b" text-anchor="middle" font-weight="700">G</text><rect x="295" y="585" width="65" height="65" rx="0" fill="#d4e2f4" stroke="white" stroke-width="1.8"/><text x="327.5" y="625.3" font-size="25" fill="#192c3b" text-anchor="middle" font-weight="700">B</text><rect x="100" y="650" width="65" height="65" rx="0" fill="#f9d7cf" stroke="white" stroke-width="1.8"/><text x="132.5" y="690.3" font-size="25" fill="#192c3b" text-anchor="middle" font-weight="700">R</text><rect x="165" y="650" width="65" height="65" rx="0" fill="#d2e9dc" stroke="white" stroke-width="1.8"/><text x="197.5" y="690.3" font-size="25" fill="#192c3b" text-anchor="middle" font-weight="700">G</text><rect x="230" y="650" width="65" height="65" rx="0" fill="#f9d7cf" stroke="white" stroke-width="1.8"/><text x="262.5" y="690.3" font-size="25" fill="#192c3b" text-anchor="middle" font-weight="700">R</text><rect x="295" y="650" width="65" height="65" rx="0" fill="#d2e9dc" stroke="white" stroke-width="1.8"/><text x="327.5" y="690.3" font-size="25" fill="#192c3b" text-anchor="middle" font-weight="700">G</text><rect x="100" y="715" width="65" height="65" rx="0" fill="#d2e9dc" stroke="white" stroke-width="1.8"/><text x="132.5" y="755.3" font-size="25" fill="#192c3b" text-anchor="middle" font-weight="700">G</text><rect x="165" y="715" width="65" height="65" rx="0" fill="#d4e2f4" stroke="white" stroke-width="1.8"/><text x="197.5" y="755.3" font-size="25" fill="#192c3b" text-anchor="middle" font-weight="700">B</text><rect x="230" y="715" width="65" height="65" rx="0" fill="#d2e9dc" stroke="white" stroke-width="1.8"/><text x="262.5" y="755.3" font-size="25" fill="#192c3b" text-anchor="middle" font-weight="700">G</text><rect x="295" y="715" width="65" height="65" rx="0" fill="#d4e2f4" stroke="white" stroke-width="1.8"/><text x="327.5" y="755.3" font-size="25" fill="#192c3b" text-anchor="middle" font-weight="700">B</text><line x1="410" y1="650" x2="550" y2="650" stroke="#192c3b" stroke-width="3" marker-end="url(#ink)"/><rect x="590" y="555" width="405" height="180" rx="8" fill="#f6fafc" stroke="#086fa0" stroke-width="1.8"/><text x="792.5" y="586" font-size="22" fill="#086fa0" text-anchor="middle" font-weight="700">Demosaicing</text><text x="792.5" y="615" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Each site supplies one filtered measurement.</text><text x="792.5" y="639" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">An algorithm estimates missing components</text><text x="792.5" y="663" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">to reconstruct output RGB values.</text><text x="792.5" y="687" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Other sensor arrangements also exist.</text><text x="35" y="842" font-size="19" fill="#536777" text-anchor="start" font-weight="400">The chain separates photons, electrons, volts and integer codes; these are different quantities.</text><text x="35" y="871" font-size="19" fill="#536777" text-anchor="start" font-weight="400">The component blocks are not a cross-section of one particular sensor.</text></svg>
