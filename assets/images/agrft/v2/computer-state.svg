<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="865" viewBox="0 0 1080 865" role="img" aria-labelledby="title desc"><title id="title">A circuit that retains a bit</title><desc id="desc">Positive edge D flip-flop with a timing diagram showing D sampled on rising clock edges and Q retained between edges, excluding real setup hold and propagation specifications.</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#192c3b"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#086fa0"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85d13"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#74479a"/></marker></defs><style>text{font-family:Arial,DejaVu Sans,sans-serif}path,line{stroke-linecap:round}</style><rect width="1080" height="865" fill="white"/><text x="35" y="44" font-size="28" fill="#192c3b" text-anchor="start" font-weight="700">A circuit that retains a bit</text><text x="35" y="83" font-size="20" fill="#536777" text-anchor="start" font-weight="400">Positive-edge-triggered storage · idealised timing, not device specifications</text><rect x="370" y="130" width="280" height="155" rx="8" fill="#f4f8fb" stroke="#086fa0" stroke-width="1.8"/><text x="510" y="167" font-size="25" fill="#086fa0" text-anchor="middle" font-weight="700">D FLIP-FLOP</text><text x="392" y="223" font-size="24" fill="#192c3b" text-anchor="start" font-weight="400">D</text><text x="615" y="223" font-size="24" fill="#192c3b" text-anchor="start" font-weight="400">Q</text><line x1="215" y1="215" x2="370" y2="215" stroke="#086fa0" stroke-width="3" marker-end="url(#blue)"/><line x1="650" y1="215" x2="875" y2="215" stroke="#0f766e" stroke-width="3" marker-end="url(#green)"/><text x="215" y="192" font-size="20" fill="#086fa0" text-anchor="start" font-weight="400">input state</text><text x="875" y="192" font-size="20" fill="#0f766e" text-anchor="end" font-weight="400">retained state</text><path d="M 480 285 L 495 270 L 510 285" fill="none" stroke="#74479a" stroke-width="2.5" stroke-linejoin="round"/><line x1="495" y1="330" x2="495" y2="285" stroke="#74479a" stroke-width="3" marker-end="url(#purple)"/><text x="515" y="320" font-size="21" fill="#74479a" text-anchor="start" font-weight="400">CLK</text><text x="35" y="422" font-size="22" fill="#74479a" text-anchor="start" font-weight="700">CLK</text><text x="35" y="531" font-size="22" fill="#086fa0" text-anchor="start" font-weight="700">D</text><text x="35" y="640" font-size="22" fill="#0f766e" text-anchor="start" font-weight="700">Q</text><path d="M 175 438 H 222.5 V 400 H 317.5 V 438 H 412.5 V 400 H 507.5 V 438 H 602.5 V 400 H 697.5 V 438 H 792.5 V 400 H 887.5 V 438 H 1000" fill="none" stroke="#74479a" stroke-width="3" stroke-linejoin="round"/><path d="M 175 545 H 310 V 507 H 690 V 545 H 1000" fill="none" stroke="#086fa0" stroke-width="3" stroke-linejoin="round"/><path d="M 175 654 H 420 V 616 H 800 V 654 H 1000" fill="none" stroke="#0f766e" stroke-width="3" stroke-linejoin="round"/><line x1="222.5" y1="373" x2="222.5" y2="681" stroke="#536777" stroke-width="1" stroke-dasharray="6 5"/><text x="222.5" y="715" font-size="23" fill="#74479a" text-anchor="middle" font-weight="700">↑</text><line x1="412.5" y1="373" x2="412.5" y2="681" stroke="#536777" stroke-width="1" stroke-dasharray="6 5"/><text x="412.5" y="715" font-size="23" fill="#74479a" text-anchor="middle" font-weight="700">↑</text><line x1="602.5" y1="373" x2="602.5" y2="681" stroke="#536777" stroke-width="1" stroke-dasharray="6 5"/><text x="602.5" y="715" font-size="23" fill="#74479a" text-anchor="middle" font-weight="700">↑</text><line x1="792.5" y1="373" x2="792.5" y2="681" stroke="#536777" stroke-width="1" stroke-dasharray="6 5"/><text x="792.5" y="715" font-size="23" fill="#74479a" text-anchor="middle" font-weight="700">↑</text><text x="998" y="715" font-size="20" fill="#536777" text-anchor="end" font-weight="400">time →</text><text x="35" y="765" font-size="19" fill="#536777" text-anchor="start" font-weight="400">At the first rising edge D=0; at the next two D=1; at the fourth D=0.</text><text x="35" y="793" font-size="19" fill="#536777" text-anchor="start" font-weight="400">Q changes only after the relevant capture edge and propagation delay.</text><text x="35" y="821" font-size="19" fill="#536777" text-anchor="start" font-weight="400">D must be stable before the edge (setup) and after it (hold).</text></svg>
