<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="990" viewBox="0 0 1080 990" role="img" aria-labelledby="title desc"><title id="title">Exposure duration and readout timing are different</title><desc id="desc">Two timing panels on a common zero-to-forty-millisecond scale: simultaneous twenty-millisecond global exposure for four example rows, and rolling row exposures starting at zero four eight twelve milliseconds and ending twenty milliseconds later.</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#192c3b"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#086fa0"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85d13"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#74479a"/></marker></defs><style>text{font-family:Arial,DejaVu Sans,sans-serif}path,line{stroke-linecap:round}</style><rect width="1080" height="990" fill="white"/><text x="35" y="44" font-size="28" fill="#192c3b" text-anchor="start" font-weight="700">Exposure duration and readout timing are different</text><text x="35" y="83" font-size="20" fill="#536777" text-anchor="start" font-weight="400">25 fps gives a 40 ms frame period. Every illustrated row integrates for 20 ms (180°).</text><text x="35" y="143" font-size="22" fill="#0f766e" text-anchor="start" font-weight="700">GLOBAL EXPOSURE</text><text x="35" y="464" font-size="22" fill="#b85d13" text-anchor="start" font-weight="700">ROLLING EXPOSURE</text><line x1="220" y1="170" x2="220" y2="382" stroke="#cad4dc" stroke-width="1" stroke-dasharray="5 5"/><text x="220" y="155" font-size="18" fill="#536777" text-anchor="middle" font-weight="400">0 ms</text><line x1="410" y1="170" x2="410" y2="382" stroke="#cad4dc" stroke-width="1" stroke-dasharray="5 5"/><text x="410" y="155" font-size="18" fill="#536777" text-anchor="middle" font-weight="400">10 ms</text><line x1="600" y1="170" x2="600" y2="382" stroke="#cad4dc" stroke-width="1" stroke-dasharray="5 5"/><text x="600" y="155" font-size="18" fill="#536777" text-anchor="middle" font-weight="400">20 ms</text><line x1="790" y1="170" x2="790" y2="382" stroke="#cad4dc" stroke-width="1" stroke-dasharray="5 5"/><text x="790" y="155" font-size="18" fill="#536777" text-anchor="middle" font-weight="400">30 ms</text><line x1="980" y1="170" x2="980" y2="382" stroke="#cad4dc" stroke-width="1" stroke-dasharray="5 5"/><text x="980" y="155" font-size="18" fill="#536777" text-anchor="middle" font-weight="400">40 ms</text><line x1="220" y1="492" x2="220" y2="704" stroke="#cad4dc" stroke-width="1" stroke-dasharray="5 5"/><text x="220" y="477" font-size="18" fill="#536777" text-anchor="middle" font-weight="400">0 ms</text><line x1="410" y1="492" x2="410" y2="704" stroke="#cad4dc" stroke-width="1" stroke-dasharray="5 5"/><text x="410" y="477" font-size="18" fill="#536777" text-anchor="middle" font-weight="400">10 ms</text><line x1="600" y1="492" x2="600" y2="704" stroke="#cad4dc" stroke-width="1" stroke-dasharray="5 5"/><text x="600" y="477" font-size="18" fill="#536777" text-anchor="middle" font-weight="400">20 ms</text><line x1="790" y1="492" x2="790" y2="704" stroke="#cad4dc" stroke-width="1" stroke-dasharray="5 5"/><text x="790" y="477" font-size="18" fill="#536777" text-anchor="middle" font-weight="400">30 ms</text><line x1="980" y1="492" x2="980" y2="704" stroke="#cad4dc" stroke-width="1" stroke-dasharray="5 5"/><text x="980" y="477" font-size="18" fill="#536777" text-anchor="middle" font-weight="400">40 ms</text><text x="195" y="213" font-size="19" fill="#536777" text-anchor="end" font-weight="400">row 1</text><rect x="220" y="192" width="380" height="30" rx="2" fill="#bce1d5" stroke="#0f766e" stroke-width="1.8"/><text x="195" y="535" font-size="19" fill="#536777" text-anchor="end" font-weight="400">row 1</text><rect x="220" y="514" width="380" height="30" rx="2" fill="#f3d5b8" stroke="#b85d13" stroke-width="1.8"/><text x="612" y="536" font-size="18" fill="#b85d13" text-anchor="start" font-weight="400">0–20 ms</text><text x="195" y="259" font-size="19" fill="#536777" text-anchor="end" font-weight="400">row 2</text><rect x="220" y="238" width="380" height="30" rx="2" fill="#bce1d5" stroke="#0f766e" stroke-width="1.8"/><text x="195" y="581" font-size="19" fill="#536777" text-anchor="end" font-weight="400">row 2</text><rect x="296" y="560" width="380" height="30" rx="2" fill="#f3d5b8" stroke="#b85d13" stroke-width="1.8"/><text x="688" y="582" font-size="18" fill="#b85d13" text-anchor="start" font-weight="400">4–24 ms</text><text x="195" y="305" font-size="19" fill="#536777" text-anchor="end" font-weight="400">row 3</text><rect x="220" y="284" width="380" height="30" rx="2" fill="#bce1d5" stroke="#0f766e" stroke-width="1.8"/><text x="195" y="627" font-size="19" fill="#536777" text-anchor="end" font-weight="400">row 3</text><rect x="372" y="606" width="380" height="30" rx="2" fill="#f3d5b8" stroke="#b85d13" stroke-width="1.8"/><text x="764" y="628" font-size="18" fill="#b85d13" text-anchor="start" font-weight="400">8–28 ms</text><text x="195" y="351" font-size="19" fill="#536777" text-anchor="end" font-weight="400">row 4</text><rect x="220" y="330" width="380" height="30" rx="2" fill="#bce1d5" stroke="#0f766e" stroke-width="1.8"/><text x="195" y="673" font-size="19" fill="#536777" text-anchor="end" font-weight="400">row 4</text><rect x="448" y="652" width="380" height="30" rx="2" fill="#f3d5b8" stroke="#b85d13" stroke-width="1.8"/><text x="840" y="674" font-size="18" fill="#b85d13" text-anchor="start" font-weight="400">12–32 ms</text><line x1="220" y1="745" x2="448" y2="745" stroke="#74479a" stroke-width="2" marker-end="url(#purple)" marker-start="url(#purple)"/><text x="334" y="781" font-size="20" fill="#74479a" text-anchor="middle" font-weight="700">12 ms start-time skew</text><text x="35" y="838" font-size="19" fill="#536777" text-anchor="start" font-weight="400">The four rows illustrate positions within a sensor, not a literal four-row production sensor.</text><text x="35" y="868" font-size="19" fill="#536777" text-anchor="start" font-weight="400">Exposure intervals can overlap. Skew is a timing offset, not the duration of each exposure.</text><text x="35" y="898" font-size="19" fill="#536777" text-anchor="start" font-weight="400">Global exposure can be followed by sequential readout from stored charge or data.</text><text x="35" y="928" font-size="19" fill="#536777" text-anchor="start" font-weight="400">The 12 ms span here is first-to-last illustrated exposure-start skew, not total readout time.</text></svg>
