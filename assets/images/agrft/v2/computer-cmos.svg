<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="835" viewBox="0 0 1080 835" role="img" aria-labelledby="title desc"><title id="title">A transistor circuit that implements NOT</title><desc id="desc">A static CMOS inverter with a pMOS pull-up to VDD, nMOS pull-down to ground, common input at both gates and common output at both drains. Settled truth states shown.</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#192c3b"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#086fa0"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85d13"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#74479a"/></marker></defs><style>text{font-family:Arial,DejaVu Sans,sans-serif}path,line{stroke-linecap:round}</style><rect width="1080" height="835" fill="white"/><text x="35" y="44" font-size="28" fill="#192c3b" text-anchor="start" font-weight="700">A transistor circuit that implements NOT</text><text x="35" y="84" font-size="21" fill="#536777" text-anchor="start" font-weight="400">Static CMOS inverter · settled input states</text><text x="405" y="123" font-size="24" fill="#b85d13" text-anchor="middle" font-weight="700">VDD</text><line x1="405" y1="136" x2="405" y2="185" stroke="#b85d13" stroke-width="3"/><line x1="405" y1="185" x2="455" y2="185" stroke="#192c3b" stroke-width="3"/><line x1="455" y1="185" x2="455" y2="210" stroke="#192c3b" stroke-width="3"/><path d="M 455 210 V 225 M 455 235 V 250 M 455 260 V 275" fill="none" stroke="#192c3b" stroke-width="3" stroke-linejoin="round"/><line x1="455" y1="275" x2="455" y2="300" stroke="#192c3b" stroke-width="3"/><line x1="455" y1="300" x2="405" y2="300" stroke="#192c3b" stroke-width="3"/><line x1="405" y1="300" x2="405" y2="425" stroke="#192c3b" stroke-width="3"/><line x1="426" y1="207" x2="426" y2="278" stroke="#192c3b" stroke-width="3"/><circle cx="415" cy="242" r="8" fill="white" stroke="#192c3b" stroke-width="2"/><line x1="330" y1="242" x2="407" y2="242" stroke="#086fa0" stroke-width="3"/><text x="495" y="231" font-size="23" fill="#192c3b" text-anchor="start" font-weight="700">pMOS</text><text x="495" y="261" font-size="20" fill="#536777" text-anchor="start" font-weight="400">pull-up</text><line x1="405" y1="425" x2="455" y2="425" stroke="#192c3b" stroke-width="3"/><line x1="455" y1="425" x2="455" y2="450" stroke="#192c3b" stroke-width="3"/><path d="M 455 450 V 465 M 455 475 V 490 M 455 500 V 515" fill="none" stroke="#192c3b" stroke-width="3" stroke-linejoin="round"/><line x1="455" y1="515" x2="455" y2="540" stroke="#192c3b" stroke-width="3"/><line x1="455" y1="540" x2="405" y2="540" stroke="#192c3b" stroke-width="3"/><line x1="405" y1="540" x2="405" y2="600" stroke="#192c3b" stroke-width="3"/><line x1="426" y1="447" x2="426" y2="518" stroke="#192c3b" stroke-width="3"/><line x1="330" y1="483" x2="426" y2="483" stroke="#086fa0" stroke-width="3"/><text x="495" y="475" font-size="23" fill="#192c3b" text-anchor="start" font-weight="700">nMOS</text><text x="495" y="505" font-size="20" fill="#536777" text-anchor="start" font-weight="400">pull-down</text><path d="M 170 363 H 330 V 242 M 330 363 V 483" fill="none" stroke="#086fa0" stroke-width="3" stroke-linejoin="round"/><circle cx="330" cy="363" r="4" fill="#086fa0" stroke="#086fa0" stroke-width="1"/><text x="128" y="371" font-size="28" fill="#086fa0" text-anchor="middle" font-weight="700">A</text><line x1="405" y1="363" x2="690" y2="363" stroke="#0f766e" stroke-width="3" marker-end="url(#green)"/><circle cx="405" cy="363" r="4" fill="#0f766e" stroke="#0f766e" stroke-width="1"/><text x="720" y="371" font-size="26" fill="#0f766e" text-anchor="start" font-weight="700">Y = NOT A</text><line x1="370" y1="600" x2="440" y2="600" stroke="#192c3b" stroke-width="3"/><line x1="381" y1="612" x2="429" y2="612" stroke="#192c3b" stroke-width="3"/><line x1="392" y1="624" x2="418" y2="624" stroke="#192c3b" stroke-width="3"/><text x="405" y="661" font-size="21" fill="#536777" text-anchor="middle" font-weight="400">0 V reference</text><rect x="690" y="160" width="335" height="127" rx="8" fill="#f6fafc" stroke="#086fa0" stroke-width="1.8"/><text x="857.5" y="191" font-size="22" fill="#086fa0" text-anchor="middle" font-weight="700">A = 0</text><text x="857.5" y="220" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">pMOS on; nMOS off</text><text x="857.5" y="244" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Y approaches VDD → 1</text><rect x="690" y="440" width="335" height="127" rx="8" fill="#f6fafc" stroke="#086fa0" stroke-width="1.8"/><text x="857.5" y="471" font-size="22" fill="#086fa0" text-anchor="middle" font-weight="700">A = 1</text><text x="857.5" y="500" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">pMOS off; nMOS on</text><text x="857.5" y="524" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Y approaches ground → 0</text><text x="35" y="722" font-size="19" fill="#536777" text-anchor="start" font-weight="400">Both gate terminals share A. The two drain terminals share Y.</text><text x="35" y="751" font-size="19" fill="#536777" text-anchor="start" font-weight="400">Bulk connections: pMOS body to VDD; nMOS body to ground (omitted from symbol).</text><text x="35" y="780" font-size="19" fill="#536777" text-anchor="start" font-weight="400">Not to scale. Leakage, parasitic capacitances and switching transients are omitted.</text></svg>
