<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="820" viewBox="0 0 1080 820" role="img" aria-labelledby="title desc"><title id="title">How a lens forms a real image</title><desc id="desc">Exact paraxial thin lens ray construction with focal length fifty millimetres, object distance two hundred millimetres, image distance sixty-six and two-thirds millimetres, object height twenty and inverted image height six and two-thirds millimetres, equal axis scales.</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#192c3b"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#086fa0"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85d13"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#74479a"/></marker></defs><style>text{font-family:Arial,DejaVu Sans,sans-serif}path,line{stroke-linecap:round}</style><rect width="1080" height="820" fill="white"/><text x="35" y="44" font-size="28" fill="#192c3b" text-anchor="start" font-weight="700">How a lens forms a real image</text><text x="35" y="82" font-size="19" fill="#536777" text-anchor="start" font-weight="400">Paraxial thin-lens model, with equal horizontal and vertical scale. Distances are in millimetres.</text><line x1="65" y1="400" x2="1030" y2="400" stroke="#536777" stroke-width="1.8" marker-end="url(#ink)"/><text x="1030" y="433" font-size="18" fill="#536777" text-anchor="end" font-weight="400">optical axis</text><line x1="720" y1="205" x2="720" y2="510" stroke="#74479a" stroke-width="3"/><text x="720" y="169" font-size="22" fill="#74479a" text-anchor="middle" font-weight="700">ideal thin lens</text><text x="720" y="194" font-size="18" fill="#74479a" text-anchor="middle" font-weight="400">x = 0</text><line x1="920" y1="250" x2="920" y2="512" stroke="#cad4dc" stroke-width="2" stroke-dasharray="7 5"/><text x="920" y="229" font-size="21" fill="#536777" text-anchor="middle" font-weight="400">image plane</text><path d="M 120 340 L 720 340 L 920 420" fill="none" stroke="#086fa0" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 120 340 L 720 400 L 920 420" fill="none" stroke="#0f766e" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#green)"/><path d="M 120 340 L 720 420 L 920 420" fill="none" stroke="#b85d13" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#orange)"/><line x1="120" y1="400" x2="120" y2="340" stroke="#192c3b" stroke-width="3" marker-end="url(#ink)"/><text x="120" y="307" font-size="20" fill="#192c3b" text-anchor="middle" font-weight="700">object: 20 mm</text><line x1="920" y1="400" x2="920" y2="420" stroke="#192c3b" stroke-width="2.3" marker-end="url(#ink)"/><text x="920" y="480" font-size="20" fill="#192c3b" text-anchor="middle" font-weight="700">image: −6.67 mm</text><circle cx="570" cy="400" r="4" fill="#74479a" stroke="#74479a" stroke-width="1"/><circle cx="870" cy="400" r="4" fill="#74479a" stroke="#74479a" stroke-width="1"/><text x="570" y="439" font-size="18" fill="#74479a" text-anchor="middle" font-weight="400">F · −50</text><text x="870" y="375" font-size="18" fill="#74479a" text-anchor="middle" font-weight="400">F′ · +50</text><line x1="120" y1="555" x2="720" y2="555" stroke="#192c3b" stroke-width="1.7" marker-end="url(#ink)" marker-start="url(#ink)"/><text x="420" y="587" font-size="21" fill="#192c3b" text-anchor="middle" font-weight="400">u = 200 mm</text><line x1="720" y1="555" x2="920" y2="555" stroke="#192c3b" stroke-width="1.7" marker-end="url(#ink)" marker-start="url(#ink)"/><text x="820" y="587" font-size="20" fill="#192c3b" text-anchor="middle" font-weight="400">v = 66.67 mm</text><text x="35" y="656" font-size="20" fill="#536777" text-anchor="start" font-weight="400">1/f = 1/u + 1/v → v = fu/(u − f) = 50 × 200/150 = 66.67 mm.</text><text x="35" y="686" font-size="20" fill="#536777" text-anchor="start" font-weight="400">Magnification m = −v/u = −1/3. The real image is inverted.</text><text x="35" y="716" font-size="20" fill="#536777" text-anchor="start" font-weight="400">Blue: parallel ray through rear focus. Green: ray through optical centre.</text><text x="35" y="746" font-size="20" fill="#536777" text-anchor="start" font-weight="400">Orange: ray through front focus, then parallel. This is not a manufacturing cross-section.</text></svg>
