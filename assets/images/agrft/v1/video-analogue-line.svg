<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="930" viewBox="0 0 1080 930" role="img" aria-labelledby="title desc"><title id="title">An analogue video line has picture and timing information</title><desc id="desc">Functional PAL composite line waveform with sync tip minus point three volts, zero blanking reference, nominal white point seven volts, back porch burst and active luma, with 64 microsecond period and approximate 4.7 microsecond sync duration. Horizontal intervals not to scale.</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#192c3b"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#086fa0"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85d13"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#74479a"/></marker></defs><style>text{font-family:Arial,DejaVu Sans,sans-serif}path,line{stroke-linecap:round}</style><rect width="1080" height="930" fill="white"/><text x="35" y="44" font-size="28" fill="#192c3b" text-anchor="start" font-weight="700">An analogue video line has picture and timing information</text><text x="35" y="81" font-size="19" fill="#536777" text-anchor="start" font-weight="400">Normal 625/50 PAL picture line. Functional waveform: horizontal intervals are not to scale.</text><line x1="110" y1="170" x2="1015" y2="170" stroke="#cad4dc" stroke-width="1" stroke-dasharray="5 5"/><text x="95" y="175" font-size="19" fill="#536777" text-anchor="end" font-weight="400">+0.7 V</text><line x1="110" y1="352" x2="1015" y2="352" stroke="#cad4dc" stroke-width="1" stroke-dasharray="5 5"/><text x="95" y="357" font-size="19" fill="#536777" text-anchor="end" font-weight="400">0 V</text><line x1="110" y1="430" x2="1015" y2="430" stroke="#cad4dc" stroke-width="1" stroke-dasharray="5 5"/><text x="95" y="435" font-size="19" fill="#536777" text-anchor="end" font-weight="400">−0.3 V</text><text x="98" y="141" font-size="18" fill="#536777" text-anchor="start" font-weight="400">nominal levels</text><path d="M 110 352 V 430 H 220 V 352 H 248 L 248.00 352.00 L 249.00 337.08 L 250.00 324.42 L 251.00 315.97 L 252.00 313.00 L 253.00 315.97 L 254.00 324.42 L 255.00 337.08 L 256.00 352.00 L 257.00 366.92 L 258.00 379.58 L 259.00 388.03 L 260.00 391.00 L 261.00 388.03 L 262.00 379.58 L 263.00 366.92 L 264.00 352.00 L 265.00 337.08 L 266.00 324.42 L 267.00 315.97 L 268.00 313.00 L 269.00 315.97 L 270.00 324.42 L 271.00 337.08 L 272.00 352.00 L 273.00 366.92 L 274.00 379.58 L 275.00 388.03 L 276.00 391.00 L 277.00 388.03 L 278.00 379.58 L 279.00 366.92 L 280.00 352.00 L 281.00 337.08 L 282.00 324.42 L 283.00 315.97 L 284.00 313.00 L 285.00 315.97 L 286.00 324.42 L 287.00 337.08 L 288.00 352.00 L 289.00 366.92 L 290.00 379.58 L 291.00 388.03 L 292.00 391.00 L 293.00 388.03 L 294.00 379.58 L 295.00 366.92 L 296.00 352.00 L 297.00 337.08 L 298.00 324.42 L 299.00 315.97 L 300.00 313.00 L 301.00 315.97 L 302.00 324.42 L 303.00 337.08 L 304.00 352.00 L 305.00 366.92 L 306.00 379.58 L 307.00 388.03 L 308.00 391.00 L 309.00 388.03 L 310.00 379.58 L 311.00 366.92 L 312.00 352.00 L 313.00 337.08 L 314.00 324.42 L 315.00 315.97 L 316.00 313.00 L 317.00 315.97 L 318.00 324.42 L 319.00 337.08 L 320.00 352.00 L 321.00 366.92 L 322.00 379.58 L 323.00 388.03 L 324.00 391.00 L 325.00 388.03 L 326.00 379.58 L 327.00 366.92 L 328.00 352.00 L 329.00 337.08 L 330.00 324.42 L 331.00 315.97 L 332.00 313.00 L 333.00 315.97 L 334.00 324.42 L 335.00 337.08 L 336.00 352.00 L 337.00 366.92 L 338.00 379.58 L 339.00 388.03 L 340.00 391.00 L 341.00 388.03 L 342.00 379.58 L 343.00 366.92 L 344.00 352.00 H 378 L 378 326.00 L 420 235.00 L 460 227.20 L 495 294.80 L 540 300.00 L 580 190.80 L 630 177.80 L 680 261.00 L 725 253.20 L 765 313.00 L 810 219.40 L 860 222.00 L 910 287.00 L 930 352.00 H 990 V 430 H 1015" fill="none" stroke="#086fa0" stroke-width="3" stroke-linejoin="round"/><line x1="110" y1="486" x2="990" y2="486" stroke="#192c3b" stroke-width="2" marker-end="url(#ink)" marker-start="url(#ink)"/><text x="550" y="522" font-size="22" fill="#192c3b" text-anchor="middle" font-weight="700">one line period = 64 microseconds</text><line x1="110" y1="577" x2="220" y2="577" stroke="#74479a" stroke-width="2"/><line x1="110" y1="570" x2="110" y2="584" stroke="#74479a" stroke-width="2"/><line x1="220" y1="570" x2="220" y2="584" stroke="#74479a" stroke-width="2"/><text x="165" y="615" font-size="18" fill="#74479a" text-anchor="middle" font-weight="400">sync</text><line x1="220" y1="577" x2="378" y2="577" stroke="#74479a" stroke-width="2"/><line x1="220" y1="570" x2="220" y2="584" stroke="#74479a" stroke-width="2"/><line x1="378" y1="570" x2="378" y2="584" stroke="#74479a" stroke-width="2"/><text x="299" y="615" font-size="18" fill="#74479a" text-anchor="middle" font-weight="400">back porch</text><line x1="378" y1="577" x2="930" y2="577" stroke="#74479a" stroke-width="2"/><line x1="378" y1="570" x2="378" y2="584" stroke="#74479a" stroke-width="2"/><line x1="930" y1="570" x2="930" y2="584" stroke="#74479a" stroke-width="2"/><text x="654" y="615" font-size="18" fill="#74479a" text-anchor="middle" font-weight="400">active picture</text><line x1="930" y1="577" x2="990" y2="577" stroke="#74479a" stroke-width="2"/><line x1="930" y1="570" x2="930" y2="584" stroke="#74479a" stroke-width="2"/><line x1="990" y1="570" x2="990" y2="584" stroke="#74479a" stroke-width="2"/><text x="960" y="636" font-size="18" fill="#74479a" text-anchor="middle" font-weight="400">front porch</text><text x="160" y="661" font-size="18" fill="#536777" text-anchor="middle" font-weight="400">sync pulse ≈ 4.7 µs</text><text x="296" y="691" font-size="19" fill="#536777" text-anchor="middle" font-weight="400">colour burst on back porch</text><text x="35" y="757" font-size="19" fill="#536777" text-anchor="start" font-weight="400">The plotted active portion illustrates luma only; active chroma modulation is omitted.</text><text x="35" y="787" font-size="19" fill="#536777" text-anchor="start" font-weight="400">The burst is a colour reference near 4.43 MHz. These are nominal terminated PAL reference levels,</text><text x="35" y="817" font-size="19" fill="#536777" text-anchor="start" font-weight="400">not a bound on every composite excursion. Vertical-blanking lines have different structure.</text><text x="35" y="847" font-size="19" fill="#536777" text-anchor="start" font-weight="400">A 720-sample digital active window at 13.5 MHz spans 53⅓ µs; do not equate it with 52 µs.</text></svg>
