<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1030" viewBox="0 0 1080 1030" role="img" aria-labelledby="title desc"><title id="title">Three ways to retain recoverable information</title><desc id="desc">DRAM access transistor and capacitor functional circuit, SRAM cross-coupled inverter feedback core, and an illustrative two-bit NAND threshold-state distribution.</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#192c3b"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#086fa0"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85d13"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#74479a"/></marker></defs><style>text{font-family:Arial,DejaVu Sans,sans-serif}path,line{stroke-linecap:round}</style><rect width="1080" height="1030" fill="white"/><text x="35" y="44" font-size="28" fill="#192c3b" text-anchor="start" font-weight="700">Three ways to retain recoverable information</text><text x="35" y="84" font-size="19" fill="#536777" text-anchor="start" font-weight="400">Functional cell models; surrounding array, control and error-correction circuits are omitted.</text><rect x="35" y="125" width="490" height="440" rx="8" fill="#f8fafc" stroke="#cad4dc" stroke-width="1.8"/><text x="60" y="160" font-size="21" fill="#086fa0" text-anchor="start" font-weight="700">DRAM: one access transistor + capacitor</text><line x1="105" y1="245" x2="105" y2="445" stroke="#086fa0" stroke-width="3"/><text x="100" y="223" font-size="20" fill="#086fa0" text-anchor="middle" font-weight="400">bitline</text><line x1="105" y1="345" x2="205" y2="345" stroke="#086fa0" stroke-width="3"/><rect x="205" y="313" width="90" height="64" rx="0" fill="white" stroke="#086fa0" stroke-width="1.8"/><text x="250" y="354" font-size="23" fill="#086fa0" text-anchor="middle" font-weight="700">1T</text><line x1="295" y1="345" x2="405" y2="345" stroke="#0f766e" stroke-width="3"/><circle cx="405" cy="345" r="4" fill="#0f766e" stroke="#0f766e" stroke-width="1"/><path d="M 185 235 H 250 V 313" fill="none" stroke="#74479a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#purple)"/><text x="287" y="241" font-size="20" fill="#74479a" text-anchor="start" font-weight="400">wordline</text><line x1="405" y1="345" x2="405" y2="395" stroke="#0f766e" stroke-width="3"/><line x1="375" y1="395" x2="435" y2="395" stroke="#192c3b" stroke-width="3"/><line x1="375" y1="412" x2="435" y2="412" stroke="#192c3b" stroke-width="3"/><line x1="405" y1="412" x2="405" y2="455" stroke="#192c3b" stroke-width="3"/><text x="405" y="483" font-size="18" fill="#536777" text-anchor="middle" font-weight="400">plate reference</text><rect x="50" y="450" width="190" height="80" rx="8" fill="#f6fafc" stroke="#086fa0" stroke-width="1.8"/><text x="145" y="481" font-size="22" fill="#086fa0" text-anchor="middle" font-weight="700">Sense / restore</text><line x1="105" y1="445" x2="105" y2="450" stroke="#086fa0" stroke-width="3"/><text x="55" y="551" font-size="18" fill="#536777" text-anchor="start" font-weight="400">Stored charge leaks; refresh restores the state.</text><rect x="555" y="125" width="490" height="440" rx="8" fill="#f8fafc" stroke="#cad4dc" stroke-width="1.8"/><text x="580" y="160" font-size="22" fill="#0f766e" text-anchor="start" font-weight="700">SRAM: powered feedback</text><rect x="715" y="215" width="160" height="72" rx="8" fill="#f6fafc" stroke="#0f766e" stroke-width="1.8"/><text x="795" y="246" font-size="22" fill="#0f766e" text-anchor="middle" font-weight="700">NOT</text><rect x="715" y="355" width="160" height="72" rx="8" fill="#f6fafc" stroke="#0f766e" stroke-width="1.8"/><text x="795" y="386" font-size="22" fill="#0f766e" text-anchor="middle" font-weight="700">NOT</text><path d="M 655 251 H 715 M 875 251 H 955 V 391 H 875 M 715 391 H 655 V 251" fill="none" stroke="#0f766e" stroke-width="3" stroke-linejoin="round"/><text x="970" y="280" font-size="22" fill="#0f766e" text-anchor="middle" font-weight="700">Q</text><text x="638" y="372" font-size="22" fill="#0f766e" text-anchor="middle" font-weight="700">Q̅</text><circle cx="955" cy="251" r="4" fill="#0f766e" stroke="#0f766e" stroke-width="1"/><circle cx="655" cy="391" r="4" fill="#0f766e" stroke="#0f766e" stroke-width="1"/><line x1="955" y1="251" x2="1015" y2="251" stroke="#086fa0" stroke-width="2.5" marker-end="url(#blue)"/><line x1="595" y1="391" x2="655" y2="391" stroke="#086fa0" stroke-width="2.5" marker-end="url(#blue)"/><text x="585" y="478" font-size="18" fill="#536777" text-anchor="start" font-weight="400">Two inverters form the retained-state core.</text><text x="585" y="504" font-size="18" fill="#536777" text-anchor="start" font-weight="400">Two access transistors connect it to bitlines</text><text x="585" y="530" font-size="18" fill="#536777" text-anchor="start" font-weight="400">in a common six-transistor SRAM cell.</text><text x="35" y="627" font-size="24" fill="#b85d13" text-anchor="start" font-weight="700">NAND: threshold-voltage ranges can encode multiple bits</text><text x="35" y="666" font-size="19" fill="#536777" text-anchor="start" font-weight="400">Illustrative two-bit cell: four distinguishable ranges. This mapping is an example only.</text><line x1="120" y1="865" x2="1000" y2="865" stroke="#192c3b" stroke-width="2" marker-end="url(#ink)"/><text x="998" y="899" font-size="19" fill="#536777" text-anchor="end" font-weight="400">threshold voltage →</text><rect x="170" y="719" width="120" height="145" rx="0" fill="#e3f1f7" stroke="#cad4dc" stroke-width="1.8"/><path d="M 170 864.37 L 172 864.13 L 174 863.80 L 176 863.38 L 178 862.83 L 180 862.12 L 182 861.22 L 184 860.09 L 186 858.70 L 188 857.01 L 190 854.97 L 192 852.55 L 194 849.72 L 196 846.45 L 198 842.72 L 200 838.55 L 202 833.94 L 204 828.93 L 206 823.57 L 208 817.94 L 210 812.13 L 212 806.27 L 214 800.46 L 216 794.87 L 218 789.64 L 220 784.90 L 222 780.80 L 224 777.47 L 226 775.02 L 228 773.51 L 230 773.00 L 232 773.51 L 234 775.02 L 236 777.47 L 238 780.80 L 240 784.90 L 242 789.64 L 244 794.87 L 246 800.46 L 248 806.27 L 250 812.13 L 252 817.94 L 254 823.57 L 256 828.93 L 258 833.94 L 260 838.55 L 262 842.72 L 264 846.45 L 266 849.72 L 268 852.55 L 270 854.97 L 272 857.01 L 274 858.70 L 276 860.09 L 278 861.22 L 280 862.12 L 282 862.83 L 284 863.38 L 286 863.80 L 288 864.13 L 290 864.37" fill="none" stroke="#086fa0" stroke-width="3" stroke-linejoin="round"/><text x="230" y="706" font-size="22" fill="#192c3b" text-anchor="middle" font-weight="700">00</text><rect x="370" y="719" width="120" height="145" rx="0" fill="#dcefe9" stroke="#cad4dc" stroke-width="1.8"/><path d="M 370 864.37 L 372 864.13 L 374 863.80 L 376 863.38 L 378 862.83 L 380 862.12 L 382 861.22 L 384 860.09 L 386 858.70 L 388 857.01 L 390 854.97 L 392 852.55 L 394 849.72 L 396 846.45 L 398 842.72 L 400 838.55 L 402 833.94 L 404 828.93 L 406 823.57 L 408 817.94 L 410 812.13 L 412 806.27 L 414 800.46 L 416 794.87 L 418 789.64 L 420 784.90 L 422 780.80 L 424 777.47 L 426 775.02 L 428 773.51 L 430 773.00 L 432 773.51 L 434 775.02 L 436 777.47 L 438 780.80 L 440 784.90 L 442 789.64 L 444 794.87 L 446 800.46 L 448 806.27 L 450 812.13 L 452 817.94 L 454 823.57 L 456 828.93 L 458 833.94 L 460 838.55 L 462 842.72 L 464 846.45 L 466 849.72 L 468 852.55 L 470 854.97 L 472 857.01 L 474 858.70 L 476 860.09 L 478 861.22 L 480 862.12 L 482 862.83 L 484 863.38 L 486 863.80 L 488 864.13 L 490 864.37" fill="none" stroke="#0f766e" stroke-width="3" stroke-linejoin="round"/><text x="430" y="706" font-size="22" fill="#192c3b" text-anchor="middle" font-weight="700">01</text><rect x="570" y="719" width="120" height="145" rx="0" fill="#f9ead5" stroke="#cad4dc" stroke-width="1.8"/><path d="M 570 864.37 L 572 864.13 L 574 863.80 L 576 863.38 L 578 862.83 L 580 862.12 L 582 861.22 L 584 860.09 L 586 858.70 L 588 857.01 L 590 854.97 L 592 852.55 L 594 849.72 L 596 846.45 L 598 842.72 L 600 838.55 L 602 833.94 L 604 828.93 L 606 823.57 L 608 817.94 L 610 812.13 L 612 806.27 L 614 800.46 L 616 794.87 L 618 789.64 L 620 784.90 L 622 780.80 L 624 777.47 L 626 775.02 L 628 773.51 L 630 773.00 L 632 773.51 L 634 775.02 L 636 777.47 L 638 780.80 L 640 784.90 L 642 789.64 L 644 794.87 L 646 800.46 L 648 806.27 L 650 812.13 L 652 817.94 L 654 823.57 L 656 828.93 L 658 833.94 L 660 838.55 L 662 842.72 L 664 846.45 L 666 849.72 L 668 852.55 L 670 854.97 L 672 857.01 L 674 858.70 L 676 860.09 L 678 861.22 L 680 862.12 L 682 862.83 L 684 863.38 L 686 863.80 L 688 864.13 L 690 864.37" fill="none" stroke="#b85d13" stroke-width="3" stroke-linejoin="round"/><text x="630" y="706" font-size="22" fill="#192c3b" text-anchor="middle" font-weight="700">10</text><rect x="770" y="719" width="120" height="145" rx="0" fill="#eadef5" stroke="#cad4dc" stroke-width="1.8"/><path d="M 770 864.37 L 772 864.13 L 774 863.80 L 776 863.38 L 778 862.83 L 780 862.12 L 782 861.22 L 784 860.09 L 786 858.70 L 788 857.01 L 790 854.97 L 792 852.55 L 794 849.72 L 796 846.45 L 798 842.72 L 800 838.55 L 802 833.94 L 804 828.93 L 806 823.57 L 808 817.94 L 810 812.13 L 812 806.27 L 814 800.46 L 816 794.87 L 818 789.64 L 820 784.90 L 822 780.80 L 824 777.47 L 826 775.02 L 828 773.51 L 830 773.00 L 832 773.51 L 834 775.02 L 836 777.47 L 838 780.80 L 840 784.90 L 842 789.64 L 844 794.87 L 846 800.46 L 848 806.27 L 850 812.13 L 852 817.94 L 854 823.57 L 856 828.93 L 858 833.94 L 860 838.55 L 862 842.72 L 864 846.45 L 866 849.72 L 868 852.55 L 870 854.97 L 872 857.01 L 874 858.70 L 876 860.09 L 878 861.22 L 880 862.12 L 882 862.83 L 884 863.38 L 886 863.80 L 888 864.13 L 890 864.37" fill="none" stroke="#74479a" stroke-width="3" stroke-linejoin="round"/><text x="830" y="706" font-size="22" fill="#192c3b" text-anchor="middle" font-weight="700">11</text><text x="35" y="945" font-size="19" fill="#536777" text-anchor="start" font-weight="400">SLC: 2 states → 1 bit.  Two-bit MLC: 4 → 2.  TLC: 8 → 3.  QLC: 16 → 4.</text><text x="35" y="974" font-size="19" fill="#536777" text-anchor="start" font-weight="400">More encoded bits per cell require more physical states to remain distinguishable.</text><line x1="670" y1="251" x2="715" y2="251" stroke="#0f766e" stroke-width="2.5" marker-end="url(#green)"/><line x1="940" y1="391" x2="875" y2="391" stroke="#0f766e" stroke-width="2.5" marker-end="url(#green)"/></svg>
