<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="865" viewBox="0 0 1080 865" role="img" aria-labelledby="title desc"><title id="title">From logic functions to binary addition</title><desc id="desc">Full adder Boolean circuit and a five-bit portion of an eight-bit ripple-carry example computing thirteen plus seven equals twenty.</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#192c3b"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#086fa0"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85d13"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#74479a"/></marker></defs><style>text{font-family:Arial,DejaVu Sans,sans-serif}path,line{stroke-linecap:round}</style><rect width="1080" height="865" fill="white"/><text x="35" y="44" font-size="28" fill="#192c3b" text-anchor="start" font-weight="700">From logic functions to binary addition</text><text x="35" y="80" font-size="19" fill="#536777" text-anchor="start" font-weight="400">One full adder: S = A XOR B XOR Cin; Cout = (A AND B) OR (Cin AND (A XOR B)).</text><rect x="245" y="145" width="125" height="70" rx="8" fill="#f3f8fb" stroke="#086fa0" stroke-width="1.8"/><text x="307.5" y="188" font-size="25" fill="#086fa0" text-anchor="middle" font-weight="700">XOR</text><rect x="600" y="145" width="125" height="70" rx="8" fill="#f3f8fb" stroke="#086fa0" stroke-width="1.8"/><text x="662.5" y="188" font-size="25" fill="#086fa0" text-anchor="middle" font-weight="700">XOR</text><rect x="245" y="335" width="125" height="70" rx="8" fill="#f3f8fb" stroke="#086fa0" stroke-width="1.8"/><text x="307.5" y="378" font-size="25" fill="#086fa0" text-anchor="middle" font-weight="700">AND</text><rect x="600" y="335" width="125" height="70" rx="8" fill="#f3f8fb" stroke="#086fa0" stroke-width="1.8"/><text x="662.5" y="378" font-size="25" fill="#086fa0" text-anchor="middle" font-weight="700">AND</text><rect x="855" y="300" width="125" height="70" rx="8" fill="#f3f8fb" stroke="#086fa0" stroke-width="1.8"/><text x="917.5" y="343" font-size="25" fill="#086fa0" text-anchor="middle" font-weight="700">OR</text><text x="65" y="168" font-size="24" fill="#192c3b" text-anchor="middle" font-weight="700">A</text><text x="65" y="246" font-size="24" fill="#192c3b" text-anchor="middle" font-weight="700">B</text><text x="65" y="468" font-size="24" fill="#192c3b" text-anchor="middle" font-weight="700">Cin</text><path d="M 90 160 H 170 V 165 H 245 M 170 160 V 350 H 245" fill="none" stroke="#086fa0" stroke-width="2.5" stroke-linejoin="round"/><circle cx="170" cy="160" r="4" fill="#086fa0" stroke="#086fa0" stroke-width="1"/><path d="M 90 240 H 135 V 195 H 245 M 135 240 V 390 H 245" fill="none" stroke="#086fa0" stroke-width="2.5" stroke-linejoin="round"/><circle cx="135" cy="240" r="4" fill="#086fa0" stroke="#086fa0" stroke-width="1"/><path d="M 370 180 H 445 V 165 H 600 M 445 180 V 355 H 600" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linejoin="round"/><circle cx="445" cy="180" r="4" fill="#0f766e" stroke="#0f766e" stroke-width="1"/><text x="467" y="220" font-size="18" fill="#0f766e" text-anchor="start" font-weight="400">A XOR B</text><path d="M 90 460 H 525 V 195 H 600 M 525 460 V 385 H 600" fill="none" stroke="#74479a" stroke-width="2.5" stroke-linejoin="round"/><circle cx="525" cy="385" r="4" fill="#74479a" stroke="#74479a" stroke-width="1"/><path d="M 370 370 H 395 V 290 H 790 V 320 H 855" fill="none" stroke="#b85d13" stroke-width="2.5" stroke-linejoin="round"/><path d="M 725 370 H 820 V 350 H 855" fill="none" stroke="#b85d13" stroke-width="2.5" stroke-linejoin="round"/><line x1="725" y1="180" x2="1030" y2="180" stroke="#0f766e" stroke-width="3" marker-end="url(#green)"/><text x="965" y="160" font-size="24" fill="#0f766e" text-anchor="middle" font-weight="700">S</text><line x1="980" y1="335" x2="1040" y2="335" stroke="#b85d13" stroke-width="3" marker-end="url(#orange)"/><text x="970" y="407" font-size="24" fill="#b85d13" text-anchor="middle" font-weight="700">Cout</text><text x="35" y="530" font-size="24" fill="#192c3b" text-anchor="start" font-weight="700">Connecting stages: 13 + 7, shown least significant bit first</text><rect x="85" y="610" width="140" height="100" rx="8" fill="#f6fafc" stroke="#086fa0" stroke-width="1.8"/><text x="155" y="641" font-size="22" fill="#086fa0" text-anchor="middle" font-weight="700">bit 0</text><text x="155" y="670" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">A=1  B=1</text><text x="155" y="694" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">S=0</text><line x1="155" y1="570" x2="155" y2="610" stroke="#086fa0" stroke-width="2" marker-end="url(#blue)"/><text x="155" y="557" font-size="17" fill="#536777" text-anchor="middle" font-weight="400">A, B</text><line x1="225" y1="657" x2="285" y2="657" stroke="#b85d13" stroke-width="2" marker-end="url(#orange)"/><text x="255" y="638" font-size="18" fill="#b85d13" text-anchor="middle" font-weight="700">1</text><rect x="285" y="610" width="140" height="100" rx="8" fill="#f6fafc" stroke="#086fa0" stroke-width="1.8"/><text x="355" y="641" font-size="22" fill="#086fa0" text-anchor="middle" font-weight="700">bit 1</text><text x="355" y="670" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">A=0  B=1</text><text x="355" y="694" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">S=0</text><line x1="355" y1="570" x2="355" y2="610" stroke="#086fa0" stroke-width="2" marker-end="url(#blue)"/><text x="355" y="557" font-size="17" fill="#536777" text-anchor="middle" font-weight="400">A, B</text><line x1="425" y1="657" x2="485" y2="657" stroke="#b85d13" stroke-width="2" marker-end="url(#orange)"/><text x="455" y="638" font-size="18" fill="#b85d13" text-anchor="middle" font-weight="700">1</text><rect x="485" y="610" width="140" height="100" rx="8" fill="#f6fafc" stroke="#086fa0" stroke-width="1.8"/><text x="555" y="641" font-size="22" fill="#086fa0" text-anchor="middle" font-weight="700">bit 2</text><text x="555" y="670" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">A=1  B=1</text><text x="555" y="694" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">S=1</text><line x1="555" y1="570" x2="555" y2="610" stroke="#086fa0" stroke-width="2" marker-end="url(#blue)"/><text x="555" y="557" font-size="17" fill="#536777" text-anchor="middle" font-weight="400">A, B</text><line x1="625" y1="657" x2="685" y2="657" stroke="#b85d13" stroke-width="2" marker-end="url(#orange)"/><text x="655" y="638" font-size="18" fill="#b85d13" text-anchor="middle" font-weight="700">1</text><rect x="685" y="610" width="140" height="100" rx="8" fill="#f6fafc" stroke="#086fa0" stroke-width="1.8"/><text x="755" y="641" font-size="22" fill="#086fa0" text-anchor="middle" font-weight="700">bit 3</text><text x="755" y="670" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">A=1  B=0</text><text x="755" y="694" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">S=0</text><line x1="755" y1="570" x2="755" y2="610" stroke="#086fa0" stroke-width="2" marker-end="url(#blue)"/><text x="755" y="557" font-size="17" fill="#536777" text-anchor="middle" font-weight="400">A, B</text><line x1="825" y1="657" x2="885" y2="657" stroke="#b85d13" stroke-width="2" marker-end="url(#orange)"/><text x="855" y="638" font-size="18" fill="#b85d13" text-anchor="middle" font-weight="700">1</text><rect x="885" y="610" width="140" height="100" rx="8" fill="#f6fafc" stroke="#086fa0" stroke-width="1.8"/><text x="955" y="641" font-size="22" fill="#086fa0" text-anchor="middle" font-weight="700">bit 4</text><text x="955" y="670" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">A=0  B=0</text><text x="955" y="694" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">S=1</text><line x1="955" y1="570" x2="955" y2="610" stroke="#086fa0" stroke-width="2" marker-end="url(#blue)"/><text x="955" y="557" font-size="17" fill="#536777" text-anchor="middle" font-weight="400">A, B</text><line x1="35" y1="657" x2="85" y2="657" stroke="#b85d13" stroke-width="2" marker-end="url(#orange)"/><text x="50" y="638" font-size="18" fill="#b85d13" text-anchor="middle" font-weight="700">0</text><text x="35" y="765" font-size="19" fill="#536777" text-anchor="start" font-weight="400">Carries travel towards higher significance. Read the result in reverse position order: 10100₂ = 20.</text><text x="35" y="793" font-size="19" fill="#536777" text-anchor="start" font-weight="400">Bits 5–7 are zero. Dots indicate joins; unmarked crossing paths do not join.</text><text x="35" y="821" font-size="19" fill="#536777" text-anchor="start" font-weight="400">Rectangles identify Boolean functions; the drawing is not a transistor layout.</text></svg>
