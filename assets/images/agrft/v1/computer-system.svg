<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1000" viewBox="0 0 1080 1000" role="img" aria-labelledby="title desc"><title id="title">Computer components and their connections</title><desc id="desc">Functional data paths in a representative desktop: CPU memory controller to DRAM, PCIe to discrete GPU and NVMe SSD, platform link to chipset and additional I/O. Power is described separately.</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#192c3b"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#086fa0"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85d13"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#74479a"/></marker></defs><style>text{font-family:Arial,DejaVu Sans,sans-serif}path,line{stroke-linecap:round}</style><rect width="1080" height="1000" fill="white"/><text x="35" y="44" font-size="28" fill="#192c3b" text-anchor="start" font-weight="700">Computer components and their connections</text><text x="35" y="80" font-size="19" fill="#536777" text-anchor="start" font-weight="400">Representative modern desktop; arrows show data links, not physical board positions.</text><rect x="365" y="120" width="350" height="200" rx="8" fill="#edf5fa" stroke="#086fa0" stroke-width="1.8"/><text x="540" y="151" font-size="23" fill="#086fa0" text-anchor="middle" font-weight="700">PROCESSOR PACKAGE</text><rect x="385" y="170" width="155" height="120" rx="8" fill="#f6fafc" stroke="#086fa0" stroke-width="1.8"/><text x="462.5" y="201" font-size="22" fill="#086fa0" text-anchor="middle" font-weight="700">CPU cores</text><text x="462.5" y="230" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Registers</text><text x="462.5" y="254" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">ALUs · caches</text><rect x="555" y="170" width="140" height="120" rx="8" fill="#f6fafc" stroke="#086fa0" stroke-width="1.8"/><text x="625" y="201" font-size="22" fill="#086fa0" text-anchor="middle" font-weight="700">Controllers</text><text x="625" y="230" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Memory</text><text x="625" y="254" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">PCIe / I/O</text><rect x="35" y="155" width="230" height="120" rx="8" fill="#f6fafc" stroke="#0f766e" stroke-width="1.8"/><text x="150" y="186" font-size="22" fill="#0f766e" text-anchor="middle" font-weight="700">Main memory</text><text x="150" y="215" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">DRAM modules</text><text x="150" y="239" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Working instructions</text><text x="150" y="263" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">and data</text><line x1="365" y1="225" x2="265" y2="225" stroke="#0f766e" stroke-width="3" marker-end="url(#green)" marker-start="url(#green)"/><text x="315" y="209" font-size="18" fill="#0f766e" text-anchor="middle" font-weight="400">DDR</text><rect x="815" y="155" width="230" height="120" rx="8" fill="#f6fafc" stroke="#086fa0" stroke-width="1.8"/><text x="930" y="186" font-size="22" fill="#086fa0" text-anchor="middle" font-weight="700">Graphics card</text><text x="930" y="215" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">GPU + VRAM</text><text x="930" y="239" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Display / media engines</text><line x1="715" y1="225" x2="815" y2="225" stroke="#086fa0" stroke-width="3" marker-end="url(#blue)" marker-start="url(#blue)"/><text x="765" y="208" font-size="18" fill="#086fa0" text-anchor="middle" font-weight="400">PCIe</text><rect x="400" y="410" width="280" height="110" rx="8" fill="#f6fafc" stroke="#74479a" stroke-width="1.8"/><text x="540" y="441" font-size="22" fill="#74479a" text-anchor="middle" font-weight="700">I/O chipset</text><text x="540" y="470" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Additional controllers</text><text x="540" y="494" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Shared upstream link</text><line x1="540" y1="320" x2="540" y2="410" stroke="#74479a" stroke-width="3" marker-end="url(#purple)" marker-start="url(#purple)"/><text x="554" y="369" font-size="18" fill="#74479a" text-anchor="start" font-weight="400">platform link</text><rect x="35" y="420" width="225" height="105" rx="8" fill="#f6fafc" stroke="#0f766e" stroke-width="1.8"/><text x="147.5" y="451" font-size="22" fill="#0f766e" text-anchor="middle" font-weight="700">NVMe SSD</text><text x="147.5" y="480" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Controller + NAND</text><text x="147.5" y="504" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Persistent file storage</text><path d="M 365 282 H 295 V 471 H 260" fill="none" stroke="#0f766e" stroke-width="3" stroke-linejoin="round" marker-end="url(#green)"/><text x="270" y="365" font-size="18" fill="#0f766e" text-anchor="middle" font-weight="400">PCIe</text><rect x="810" y="420" width="235" height="105" rx="8" fill="#f6fafc" stroke="#74479a" stroke-width="1.8"/><text x="927.5" y="451" font-size="22" fill="#74479a" text-anchor="middle" font-weight="700">USB controller path</text><text x="927.5" y="480" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">External storage</text><text x="927.5" y="504" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Audio interface / input</text><line x1="680" y1="465" x2="810" y2="465" stroke="#74479a" stroke-width="3" marker-end="url(#purple)" marker-start="url(#purple)"/><rect x="195" y="600" width="250" height="105" rx="8" fill="#f6fafc" stroke="#0f766e" stroke-width="1.8"/><text x="320" y="631" font-size="22" fill="#0f766e" text-anchor="middle" font-weight="700">SATA storage</text><text x="320" y="660" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">HDD / SATA SSD</text><text x="320" y="684" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Separate power cable</text><path d="M 465 520 V 570 H 320 V 600" fill="none" stroke="#0f766e" stroke-width="3" stroke-linejoin="round" marker-end="url(#green)"/><rect x="580" y="600" width="265" height="105" rx="8" fill="#f6fafc" stroke="#74479a" stroke-width="1.8"/><text x="712.5" y="631" font-size="22" fill="#74479a" text-anchor="middle" font-weight="700">Other I/O devices</text><text x="712.5" y="660" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Network · audio codec</text><text x="712.5" y="684" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Extra PCIe devices</text><path d="M 615 520 V 570 H 712 V 600" fill="none" stroke="#74479a" stroke-width="3" stroke-linejoin="round" marker-end="url(#purple)"/><rect x="35" y="760" width="1010" height="125" rx="8" fill="#fff7ee" stroke="#d9ac79" stroke-width="1.8"/><text x="55" y="791" font-size="21" fill="#b85d13" text-anchor="start" font-weight="700">POWER IS A SEPARATE NETWORK</text><text x="55" y="823" font-size="19" fill="#192c3b" text-anchor="start" font-weight="400">Mains → enclosed PSU → regulated DC rails → board/device regulators → loads.</text><text x="55" y="851" font-size="19" fill="#192c3b" text-anchor="start" font-weight="400">Exact socket wiring, lane sharing, integrated functions and power connectors depend on the machine.</text><text x="35" y="931" font-size="19" fill="#536777" text-anchor="start" font-weight="400">Some NVMe slots connect through the chipset. Some GPUs share system memory.</text><text x="35" y="958" font-size="19" fill="#536777" text-anchor="start" font-weight="400">Arrow directions indicate transfers; control traffic and physical power wiring are not drawn.</text></svg>
