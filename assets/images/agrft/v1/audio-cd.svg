<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="930" viewBox="0 0 1080 930" role="img" aria-labelledby="title desc"><title id="title">How an audio CD carries digital sound</title><desc id="desc">CD-DA layered arithmetic: stereo sixteen-bit forty-four-point-one kilohertz PCM, logical 2352-byte audio blocks at 75 per second, and CIRC EFM physical frames of 588 channel bits at 7350 per second.</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#192c3b"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#086fa0"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85d13"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#74479a"/></marker></defs><style>text{font-family:Arial,DejaVu Sans,sans-serif}path,line{stroke-linecap:round}</style><rect width="1080" height="930" fill="white"/><text x="35" y="44" font-size="28" fill="#192c3b" text-anchor="start" font-weight="700">How an audio CD carries digital sound</text><text x="35" y="83" font-size="19" fill="#536777" text-anchor="start" font-weight="400">CD-DA: audio sample frames, audio blocks and physical channel frames are different units.</text><rect x="35" y="135" width="470" height="125" rx="8" fill="#f6fafc" stroke="#0f766e" stroke-width="1.8"/><text x="270" y="166" font-size="22" fill="#0f766e" text-anchor="middle" font-weight="700">PCM audio</text><text x="270" y="195" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">44,100 stereo sample frames/s</text><text x="270" y="219" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">2 channels × 16 bits = 4 bytes per sample frame</text><text x="270" y="243" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">176,400 audio bytes/s</text><rect x="590" y="135" width="455" height="125" rx="8" fill="#f6fafc" stroke="#0f766e" stroke-width="1.8"/><text x="817.5" y="166" font-size="22" fill="#0f766e" text-anchor="middle" font-weight="700">Logical audio blocks</text><text x="817.5" y="195" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">2,352 audio bytes per block</text><text x="817.5" y="219" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">75 blocks/s × 2,352 bytes = 176,400 bytes/s</text><text x="817.5" y="243" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">588 stereo sample frames per block</text><line x1="505" y1="198" x2="590" y2="198" stroke="#0f766e" stroke-width="3" marker-end="url(#green)"/><text x="35" y="327" font-size="24" fill="#192c3b" text-anchor="start" font-weight="700">Physical coding adds structure and redundancy</text><rect x="35" y="365" width="275" height="135" rx="8" fill="#f6fafc" stroke="#086fa0" stroke-width="1.8"/><text x="172.5" y="396" font-size="22" fill="#086fa0" text-anchor="middle" font-weight="700">Per small channel frame</text><text x="172.5" y="425" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">24 audio-data bytes</text><text x="172.5" y="449" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">8 CIRC parity symbols</text><text x="172.5" y="473" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">1 control / sync symbol</text><rect x="405" y="365" width="270" height="135" rx="8" fill="#f6fafc" stroke="#086fa0" stroke-width="1.8"/><text x="540" y="396" font-size="22" fill="#086fa0" text-anchor="middle" font-weight="700">33 symbol positions</text><text x="540" y="425" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">14 channel bits per position</text><text x="540" y="449" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">plus merging bits</text><text x="540" y="473" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">and frame synchronisation</text><line x1="310" y1="428" x2="405" y2="428" stroke="#086fa0" stroke-width="3" marker-end="url(#blue)"/><rect x="770" y="365" width="275" height="135" rx="8" fill="#f6fafc" stroke="#b85d13" stroke-width="1.8"/><text x="907.5" y="396" font-size="22" fill="#b85d13" text-anchor="middle" font-weight="700">588 channel bits</text><text x="907.5" y="425" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Per small channel frame</text><text x="907.5" y="449" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">7,350 frames per second</text><text x="907.5" y="473" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">4,321,800 channel bits/s</text><line x1="675" y1="428" x2="770" y2="428" stroke="#b85d13" stroke-width="3" marker-end="url(#orange)"/><rect x="35" y="565" width="1010" height="185" rx="8" fill="#f6fafc" stroke="#cad4dc" stroke-width="1.8"/><text x="60" y="603" font-size="21" fill="#192c3b" text-anchor="start" font-weight="400">Frame arithmetic: 33 × 14 + 33 × 3 + 27 = 588 channel bits.</text><text x="60" y="637" font-size="21" fill="#192c3b" text-anchor="start" font-weight="400">98 small channel frames form a section; 75 sections/s give 7,350 channel frames/s.</text><text x="60" y="671" font-size="21" fill="#192c3b" text-anchor="start" font-weight="400">24 × 7,350 = 176,400 original audio bytes/s.</text><text x="60" y="705" font-size="21" fill="#192c3b" text-anchor="start" font-weight="400">CIRC interleaves symbols; the physical order is not a simple unshuffled PCM byte list.</text><text x="35" y="800" font-size="19" fill="#536777" text-anchor="start" font-weight="400">Ordinary symbols use eight-to-fourteen modulation (EFM); special subcode sync symbols</text><text x="35" y="829" font-size="19" fill="#536777" text-anchor="start" font-weight="400">occupy the same 14-bit slots. Pits and lands encode the channel signal through transitions.</text><text x="35" y="858" font-size="19" fill="#536777" text-anchor="start" font-weight="400">A visible pit is not one PCM sample bit. The optical pickup must recover and decode the channel.</text></svg>
