<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="985" viewBox="0 0 1080 985" role="img" aria-labelledby="title desc"><title id="title">What chroma subsampling retains</title><desc id="desc">Separate luma Cb and Cr grids over a two-by-two progressive luma region: four four four has twelve component samples, four two two has eight, and four two zero has six, with chroma positions illustrative only.</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#192c3b"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#086fa0"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85d13"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#74479a"/></marker></defs><style>text{font-family:Arial,DejaVu Sans,sans-serif}path,line{stroke-linecap:round}</style><rect width="1080" height="985" fill="white"/><text x="35" y="44" font-size="28" fill="#192c3b" text-anchor="start" font-weight="700">What chroma subsampling retains</text><text x="35" y="83" font-size="19" fill="#536777" text-anchor="start" font-weight="400">Progressive 2 × 2 luma region; component grids show sample counts, not painted RGB pixels.</text><text x="185" y="137" font-size="29" fill="#192c3b" text-anchor="middle" font-weight="700">4:4:4</text><text x="75" y="244" font-size="23" fill="#192c3b" text-anchor="middle" font-weight="700">Y′</text><rect x="125" y="180" width="170" height="120" rx="0" fill="white" stroke="#cad4dc" stroke-width="1.8"/><line x1="210" y1="180" x2="210" y2="300" stroke="#cad4dc" stroke-width="1"/><line x1="125" y1="240" x2="295" y2="240" stroke="#cad4dc" stroke-width="1"/><circle cx="167.5" cy="210" r="10" fill="#192c3b" stroke="#192c3b" stroke-width="1"/><circle cx="252.5" cy="210" r="10" fill="#192c3b" stroke="#192c3b" stroke-width="1"/><circle cx="167.5" cy="270" r="10" fill="#192c3b" stroke="#192c3b" stroke-width="1"/><circle cx="252.5" cy="270" r="10" fill="#192c3b" stroke="#192c3b" stroke-width="1"/><text x="75" y="429" font-size="23" fill="#086fa0" text-anchor="middle" font-weight="700">Cb</text><rect x="125" y="365" width="170" height="120" rx="0" fill="white" stroke="#cad4dc" stroke-width="1.8"/><line x1="210" y1="365" x2="210" y2="485" stroke="#cad4dc" stroke-width="1"/><line x1="125" y1="425" x2="295" y2="425" stroke="#cad4dc" stroke-width="1"/><circle cx="167.5" cy="395" r="10" fill="#086fa0" stroke="#086fa0" stroke-width="1"/><circle cx="252.5" cy="395" r="10" fill="#086fa0" stroke="#086fa0" stroke-width="1"/><circle cx="167.5" cy="455" r="10" fill="#086fa0" stroke="#086fa0" stroke-width="1"/><circle cx="252.5" cy="455" r="10" fill="#086fa0" stroke="#086fa0" stroke-width="1"/><text x="75" y="614" font-size="23" fill="#b85d13" text-anchor="middle" font-weight="700">Cr</text><rect x="125" y="550" width="170" height="120" rx="0" fill="white" stroke="#cad4dc" stroke-width="1.8"/><line x1="210" y1="550" x2="210" y2="670" stroke="#cad4dc" stroke-width="1"/><line x1="125" y1="610" x2="295" y2="610" stroke="#cad4dc" stroke-width="1"/><circle cx="167.5" cy="580" r="10" fill="#b85d13" stroke="#b85d13" stroke-width="1"/><circle cx="252.5" cy="580" r="10" fill="#b85d13" stroke="#b85d13" stroke-width="1"/><circle cx="167.5" cy="640" r="10" fill="#b85d13" stroke="#b85d13" stroke-width="1"/><circle cx="252.5" cy="640" r="10" fill="#b85d13" stroke="#b85d13" stroke-width="1"/><text x="185" y="793" font-size="22" fill="#192c3b" text-anchor="middle" font-weight="700">4 Y′ + 4 Cb + 4 Cr</text><text x="185" y="827" font-size="19" fill="#536777" text-anchor="middle" font-weight="400">12 component samples</text><text x="540" y="137" font-size="29" fill="#192c3b" text-anchor="middle" font-weight="700">4:2:2</text><text x="430" y="244" font-size="23" fill="#192c3b" text-anchor="middle" font-weight="700">Y′</text><rect x="480" y="180" width="170" height="120" rx="0" fill="white" stroke="#cad4dc" stroke-width="1.8"/><line x1="565" y1="180" x2="565" y2="300" stroke="#cad4dc" stroke-width="1"/><line x1="480" y1="240" x2="650" y2="240" stroke="#cad4dc" stroke-width="1"/><circle cx="522.5" cy="210" r="10" fill="#192c3b" stroke="#192c3b" stroke-width="1"/><circle cx="607.5" cy="210" r="10" fill="#192c3b" stroke="#192c3b" stroke-width="1"/><circle cx="522.5" cy="270" r="10" fill="#192c3b" stroke="#192c3b" stroke-width="1"/><circle cx="607.5" cy="270" r="10" fill="#192c3b" stroke="#192c3b" stroke-width="1"/><text x="430" y="429" font-size="23" fill="#086fa0" text-anchor="middle" font-weight="700">Cb</text><rect x="480" y="365" width="170" height="120" rx="0" fill="white" stroke="#cad4dc" stroke-width="1.8"/><line x1="565" y1="365" x2="565" y2="485" stroke="#cad4dc" stroke-width="1"/><line x1="480" y1="425" x2="650" y2="425" stroke="#cad4dc" stroke-width="1"/><circle cx="565" cy="395" r="10" fill="#086fa0" stroke="#086fa0" stroke-width="1"/><circle cx="565" cy="455" r="10" fill="#086fa0" stroke="#086fa0" stroke-width="1"/><text x="430" y="614" font-size="23" fill="#b85d13" text-anchor="middle" font-weight="700">Cr</text><rect x="480" y="550" width="170" height="120" rx="0" fill="white" stroke="#cad4dc" stroke-width="1.8"/><line x1="565" y1="550" x2="565" y2="670" stroke="#cad4dc" stroke-width="1"/><line x1="480" y1="610" x2="650" y2="610" stroke="#cad4dc" stroke-width="1"/><circle cx="565" cy="580" r="10" fill="#b85d13" stroke="#b85d13" stroke-width="1"/><circle cx="565" cy="640" r="10" fill="#b85d13" stroke="#b85d13" stroke-width="1"/><text x="540" y="793" font-size="22" fill="#192c3b" text-anchor="middle" font-weight="700">4 Y′ + 2 Cb + 2 Cr</text><text x="540" y="827" font-size="19" fill="#536777" text-anchor="middle" font-weight="400">8 component samples</text><text x="895" y="137" font-size="29" fill="#192c3b" text-anchor="middle" font-weight="700">4:2:0</text><text x="785" y="244" font-size="23" fill="#192c3b" text-anchor="middle" font-weight="700">Y′</text><rect x="835" y="180" width="170" height="120" rx="0" fill="white" stroke="#cad4dc" stroke-width="1.8"/><line x1="920" y1="180" x2="920" y2="300" stroke="#cad4dc" stroke-width="1"/><line x1="835" y1="240" x2="1005" y2="240" stroke="#cad4dc" stroke-width="1"/><circle cx="877.5" cy="210" r="10" fill="#192c3b" stroke="#192c3b" stroke-width="1"/><circle cx="962.5" cy="210" r="10" fill="#192c3b" stroke="#192c3b" stroke-width="1"/><circle cx="877.5" cy="270" r="10" fill="#192c3b" stroke="#192c3b" stroke-width="1"/><circle cx="962.5" cy="270" r="10" fill="#192c3b" stroke="#192c3b" stroke-width="1"/><text x="785" y="429" font-size="23" fill="#086fa0" text-anchor="middle" font-weight="700">Cb</text><rect x="835" y="365" width="170" height="120" rx="0" fill="white" stroke="#cad4dc" stroke-width="1.8"/><line x1="920" y1="365" x2="920" y2="485" stroke="#cad4dc" stroke-width="1"/><line x1="835" y1="425" x2="1005" y2="425" stroke="#cad4dc" stroke-width="1"/><circle cx="920" cy="425" r="10" fill="#086fa0" stroke="#086fa0" stroke-width="1"/><text x="785" y="614" font-size="23" fill="#b85d13" text-anchor="middle" font-weight="700">Cr</text><rect x="835" y="550" width="170" height="120" rx="0" fill="white" stroke="#cad4dc" stroke-width="1.8"/><line x1="920" y1="550" x2="920" y2="670" stroke="#cad4dc" stroke-width="1"/><line x1="835" y1="610" x2="1005" y2="610" stroke="#cad4dc" stroke-width="1"/><circle cx="920" cy="610" r="10" fill="#b85d13" stroke="#b85d13" stroke-width="1"/><text x="895" y="793" font-size="22" fill="#192c3b" text-anchor="middle" font-weight="700">4 Y′ + 1 Cb + 1 Cr</text><text x="895" y="827" font-size="19" fill="#536777" text-anchor="middle" font-weight="400">6 component samples</text><text x="35" y="895" font-size="19" fill="#536777" text-anchor="start" font-weight="400">All three cases retain four luma samples. 4:2:0 still contains both colour-difference components.</text><text x="35" y="925" font-size="19" fill="#536777" text-anchor="start" font-weight="400">Dot positions illustrate density only. Exact chroma siting and interlaced arrangements vary.</text></svg>
