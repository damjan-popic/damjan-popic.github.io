<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="965" viewBox="0 0 1080 965" role="img" aria-labelledby="title desc"><title id="title">Two ways to reduce audio data</title><desc id="desc">Lossless predictive coding stores exact residual information; a representative lossy perceptual codec quantises transformed data. Containers are separate packaging and dynamic range compression is a different operation.</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#192c3b"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#086fa0"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85d13"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#74479a"/></marker></defs><style>text{font-family:Arial,DejaVu Sans,sans-serif}path,line{stroke-linecap:round}</style><rect width="1080" height="965" fill="white"/><text x="35" y="44" font-size="28" fill="#192c3b" text-anchor="start" font-weight="700">Two ways to reduce audio data</text><text x="35" y="83" font-size="20" fill="#536777" text-anchor="start" font-weight="400">Compare data compression methods applied to a defined PCM sample sequence.</text><rect x="360" y="130" width="360" height="90" rx="8" fill="#f6fafc" stroke="#086fa0" stroke-width="1.8"/><text x="540" y="161" font-size="22" fill="#086fa0" text-anchor="middle" font-weight="700">Input PCM</text><text x="540" y="190" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">The reference sample sequence</text><path d="M 450 220 V 273 H 272 V 325" fill="none" stroke="#0f766e" stroke-width="3" stroke-linejoin="round" marker-end="url(#green)"/><path d="M 630 220 V 273 H 808 V 325" fill="none" stroke="#b85d13" stroke-width="3" stroke-linejoin="round" marker-end="url(#orange)"/><text x="272" y="303" font-size="23" fill="#0f766e" text-anchor="middle" font-weight="700">LOSSLESS</text><text x="808" y="303" font-size="23" fill="#b85d13" text-anchor="middle" font-weight="700">LOSSY</text><rect x="75" y="325" width="395" height="100" rx="8" fill="#f6fafc" stroke="#0f766e" stroke-width="1.8"/><text x="272.5" y="356" font-size="22" fill="#0f766e" text-anchor="middle" font-weight="700">Predict samples</text><text x="272.5" y="385" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Use a model and retain exact residuals</text><rect x="610" y="325" width="395" height="100" rx="8" fill="#f6fafc" stroke="#b85d13" stroke-width="1.8"/><text x="807.5" y="356" font-size="22" fill="#b85d13" text-anchor="middle" font-weight="700">Transform / analyse</text><text x="807.5" y="385" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Represent time-frequency structure</text><rect x="75" y="485" width="395" height="100" rx="8" fill="#f6fafc" stroke="#0f766e" stroke-width="1.8"/><text x="272.5" y="516" font-size="22" fill="#0f766e" text-anchor="middle" font-weight="700">Entropy coding</text><text x="272.5" y="545" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Encode model + exact corrections efficiently</text><line x1="272" y1="425" x2="272" y2="485" stroke="#0f766e" stroke-width="3" marker-end="url(#green)"/><rect x="610" y="485" width="395" height="100" rx="8" fill="#f6fafc" stroke="#b85d13" stroke-width="1.8"/><text x="807.5" y="516" font-size="22" fill="#b85d13" text-anchor="middle" font-weight="700">Allocate precision and quantise</text><text x="807.5" y="545" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Perceptual model controls allowed error</text><line x1="808" y1="425" x2="808" y2="485" stroke="#b85d13" stroke-width="3" marker-end="url(#orange)"/><rect x="75" y="645" width="395" height="100" rx="8" fill="#f6fafc" stroke="#0f766e" stroke-width="1.8"/><text x="272.5" y="676" font-size="22" fill="#0f766e" text-anchor="middle" font-weight="700">Decoder</text><text x="272.5" y="705" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Restores the identical PCM values</text><line x1="272" y1="585" x2="272" y2="645" stroke="#0f766e" stroke-width="3" marker-end="url(#green)"/><rect x="610" y="645" width="395" height="100" rx="8" fill="#f6fafc" stroke="#b85d13" stroke-width="1.8"/><text x="807.5" y="676" font-size="22" fill="#b85d13" text-anchor="middle" font-weight="700">Entropy coding / decoder</text><text x="807.5" y="705" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">Reconstructed PCM approximates the input</text><line x1="808" y1="585" x2="808" y2="645" stroke="#b85d13" stroke-width="3" marker-end="url(#orange)"/><text x="35" y="804" font-size="19" fill="#536777" text-anchor="start" font-weight="400">A container packages the coded stream and metadata; it is a separate layer.</text><text x="35" y="834" font-size="19" fill="#536777" text-anchor="start" font-weight="400">Lossless PCM recovery does not require the compressed file to have the same bytes.</text><text x="35" y="864" font-size="19" fill="#536777" text-anchor="start" font-weight="400">Lossy-to-lossless conversion preserves the already altered samples; it cannot restore discarded detail.</text><text x="35" y="894" font-size="19" fill="#536777" text-anchor="start" font-weight="400">Dynamic-range compression (level control) is a different use of the word compression.</text></svg>
