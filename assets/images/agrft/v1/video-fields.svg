<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="900" viewBox="0 0 1080 900" role="img" aria-labelledby="title desc"><title id="title">Fields are captured at different times</title><desc id="desc">Illustrative alternating-line capture of a moving vertical object in two fields separated by twenty milliseconds, followed by a woven combination showing combing; explains fifty fields and twenty-five field pairs per second.</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#192c3b"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#086fa0"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85d13"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#74479a"/></marker></defs><style>text{font-family:Arial,DejaVu Sans,sans-serif}path,line{stroke-linecap:round}</style><rect width="1080" height="900" fill="white"/><text x="35" y="44" font-size="28" fill="#192c3b" text-anchor="start" font-weight="700">Fields are captured at different times</text><text x="35" y="83" font-size="19" fill="#536777" text-anchor="start" font-weight="400">Six-line teaching grid, not a literal television standard. A vertical object moves to the right.</text><text x="185" y="140" font-size="22" fill="#086fa0" text-anchor="middle" font-weight="700">Field A · t = 0 ms</text><rect x="35" y="165" width="300" height="370" rx="0" fill="#f8fafc" stroke="#cad4dc" stroke-width="1.8"/><line x1="59" y1="205" x2="312" y2="205" stroke="#086fa0" stroke-width="2"/><text x="48" y="211" font-size="16" fill="#536777" text-anchor="middle" font-weight="400">1</text><rect x="130" y="188" width="42" height="34" rx="0" fill="#0f766e" stroke="#0f766e" stroke-width="1.8"/><line x1="59" y1="261" x2="312" y2="261" stroke="#cad4dc" stroke-width="1" stroke-dasharray="5 5"/><text x="48" y="267" font-size="16" fill="#536777" text-anchor="middle" font-weight="400">2</text><line x1="59" y1="317" x2="312" y2="317" stroke="#086fa0" stroke-width="2"/><text x="48" y="323" font-size="16" fill="#536777" text-anchor="middle" font-weight="400">3</text><rect x="130" y="300" width="42" height="34" rx="0" fill="#0f766e" stroke="#0f766e" stroke-width="1.8"/><line x1="59" y1="373" x2="312" y2="373" stroke="#cad4dc" stroke-width="1" stroke-dasharray="5 5"/><text x="48" y="379" font-size="16" fill="#536777" text-anchor="middle" font-weight="400">4</text><line x1="59" y1="429" x2="312" y2="429" stroke="#086fa0" stroke-width="2"/><text x="48" y="435" font-size="16" fill="#536777" text-anchor="middle" font-weight="400">5</text><rect x="130" y="412" width="42" height="34" rx="0" fill="#0f766e" stroke="#0f766e" stroke-width="1.8"/><line x1="59" y1="485" x2="312" y2="485" stroke="#cad4dc" stroke-width="1" stroke-dasharray="5 5"/><text x="48" y="491" font-size="16" fill="#536777" text-anchor="middle" font-weight="400">6</text><text x="540" y="140" font-size="22" fill="#086fa0" text-anchor="middle" font-weight="700">Field B · t = 20 ms</text><rect x="390" y="165" width="300" height="370" rx="0" fill="#f8fafc" stroke="#cad4dc" stroke-width="1.8"/><line x1="414" y1="205" x2="667" y2="205" stroke="#cad4dc" stroke-width="1" stroke-dasharray="5 5"/><text x="403" y="211" font-size="16" fill="#536777" text-anchor="middle" font-weight="400">1</text><line x1="414" y1="261" x2="667" y2="261" stroke="#086fa0" stroke-width="2"/><text x="403" y="267" font-size="16" fill="#536777" text-anchor="middle" font-weight="400">2</text><rect x="555" y="244" width="42" height="34" rx="0" fill="#0f766e" stroke="#0f766e" stroke-width="1.8"/><line x1="414" y1="317" x2="667" y2="317" stroke="#cad4dc" stroke-width="1" stroke-dasharray="5 5"/><text x="403" y="323" font-size="16" fill="#536777" text-anchor="middle" font-weight="400">3</text><line x1="414" y1="373" x2="667" y2="373" stroke="#086fa0" stroke-width="2"/><text x="403" y="379" font-size="16" fill="#536777" text-anchor="middle" font-weight="400">4</text><rect x="555" y="356" width="42" height="34" rx="0" fill="#0f766e" stroke="#0f766e" stroke-width="1.8"/><line x1="414" y1="429" x2="667" y2="429" stroke="#cad4dc" stroke-width="1" stroke-dasharray="5 5"/><text x="403" y="435" font-size="16" fill="#536777" text-anchor="middle" font-weight="400">5</text><line x1="414" y1="485" x2="667" y2="485" stroke="#086fa0" stroke-width="2"/><text x="403" y="491" font-size="16" fill="#536777" text-anchor="middle" font-weight="400">6</text><rect x="555" y="468" width="42" height="34" rx="0" fill="#0f766e" stroke="#0f766e" stroke-width="1.8"/><text x="895" y="140" font-size="22" fill="#b85d13" text-anchor="middle" font-weight="700">Weave A + B</text><rect x="745" y="165" width="300" height="370" rx="0" fill="#f8fafc" stroke="#cad4dc" stroke-width="1.8"/><line x1="769" y1="205" x2="1022" y2="205" stroke="#086fa0" stroke-width="2"/><text x="758" y="211" font-size="16" fill="#536777" text-anchor="middle" font-weight="400">1</text><rect x="840" y="188" width="42" height="34" rx="0" fill="#b85d13" stroke="#b85d13" stroke-width="1.8"/><line x1="769" y1="261" x2="1022" y2="261" stroke="#086fa0" stroke-width="2"/><text x="758" y="267" font-size="16" fill="#536777" text-anchor="middle" font-weight="400">2</text><rect x="910" y="244" width="42" height="34" rx="0" fill="#b85d13" stroke="#b85d13" stroke-width="1.8"/><line x1="769" y1="317" x2="1022" y2="317" stroke="#086fa0" stroke-width="2"/><text x="758" y="323" font-size="16" fill="#536777" text-anchor="middle" font-weight="400">3</text><rect x="840" y="300" width="42" height="34" rx="0" fill="#b85d13" stroke="#b85d13" stroke-width="1.8"/><line x1="769" y1="373" x2="1022" y2="373" stroke="#086fa0" stroke-width="2"/><text x="758" y="379" font-size="16" fill="#536777" text-anchor="middle" font-weight="400">4</text><rect x="910" y="356" width="42" height="34" rx="0" fill="#b85d13" stroke="#b85d13" stroke-width="1.8"/><line x1="769" y1="429" x2="1022" y2="429" stroke="#086fa0" stroke-width="2"/><text x="758" y="435" font-size="16" fill="#536777" text-anchor="middle" font-weight="400">5</text><rect x="840" y="412" width="42" height="34" rx="0" fill="#b85d13" stroke="#b85d13" stroke-width="1.8"/><line x1="769" y1="485" x2="1022" y2="485" stroke="#086fa0" stroke-width="2"/><text x="758" y="491" font-size="16" fill="#536777" text-anchor="middle" font-weight="400">6</text><rect x="910" y="468" width="42" height="34" rx="0" fill="#b85d13" stroke="#b85d13" stroke-width="1.8"/><text x="35" y="594" font-size="20" fill="#536777" text-anchor="start" font-weight="400">Field A records alternate lines at one time. Field B records the other lines 20 ms later.</text><text x="35" y="625" font-size="20" fill="#536777" text-anchor="start" font-weight="400">Interleaving their rows preserves both fields but combines different moments.</text><text x="35" y="656" font-size="20" fill="#536777" text-anchor="start" font-weight="400">A moving edge can therefore acquire a comb-like outline in a woven display.</text><rect x="35" y="726" width="1010" height="127" rx="8" fill="#f3f8fb" stroke="#cad4dc" stroke-width="1.8"/><text x="55" y="760" font-size="20" fill="#192c3b" text-anchor="start" font-weight="400">625/50 interlaced timing: 50 fields/s; 25 field pairs/s.</text><text x="55" y="791" font-size="20" fill="#192c3b" text-anchor="start" font-weight="400">Next field A: t = 40 ms. A suitable 50p deinterlace can preserve 50 temporal updates/s.</text><text x="55" y="822" font-size="20" fill="#192c3b" text-anchor="start" font-weight="400">Deinterlacing estimates missing spatial information; simply discarding a field loses information.</text></svg>
