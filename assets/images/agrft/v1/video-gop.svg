<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="905" viewBox="0 0 1080 905" role="img" aria-labelledby="title desc"><title id="title">Prediction can change the order of decoding</title><desc id="desc">A four-picture GOP displayed as I0 B1 B2 P3, reference relationships from I0 and P3 to B1 and B2, and a valid decode order I0 P3 B1 B2. B pictures are non-reference only in this example.</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#192c3b"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#086fa0"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85d13"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#74479a"/></marker></defs><style>text{font-family:Arial,DejaVu Sans,sans-serif}path,line{stroke-linecap:round}</style><rect width="1080" height="905" fill="white"/><text x="35" y="44" font-size="28" fill="#192c3b" text-anchor="start" font-weight="700">Prediction can change the order of decoding</text><text x="35" y="83" font-size="19" fill="#536777" text-anchor="start" font-weight="400">One valid simplified GOP. Arrows run from a reference picture to the picture predicted from it.</text><rect x="85" y="240" width="145" height="95" rx="8" fill="#f6fafc" stroke="#0f766e" stroke-width="1.8"/><text x="157.5" y="271" font-size="22" fill="#0f766e" text-anchor="middle" font-weight="700">I0</text><text x="157.5" y="300" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">intra</text><rect x="340" y="240" width="145" height="95" rx="8" fill="#f6fafc" stroke="#b85d13" stroke-width="1.8"/><text x="412.5" y="271" font-size="22" fill="#b85d13" text-anchor="middle" font-weight="700">B1</text><text x="412.5" y="300" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">bidirectional</text><rect x="595" y="240" width="145" height="95" rx="8" fill="#f6fafc" stroke="#b85d13" stroke-width="1.8"/><text x="667.5" y="271" font-size="22" fill="#b85d13" text-anchor="middle" font-weight="700">B2</text><text x="667.5" y="300" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">bidirectional</text><rect x="850" y="240" width="145" height="95" rx="8" fill="#f6fafc" stroke="#086fa0" stroke-width="1.8"/><text x="922.5" y="271" font-size="22" fill="#086fa0" text-anchor="middle" font-weight="700">P3</text><text x="922.5" y="300" font-size="18" fill="#192c3b" text-anchor="middle" font-weight="400">predicted</text><path d="M 157 240 V 128 H 922 V 240" fill="none" stroke="#086fa0" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/><text x="540" y="118" font-size="18" fill="#086fa0" text-anchor="middle" font-weight="400">I0 supplies a reference for P3</text><path d="M 195 240 V 181 H 412 V 240" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#green)"/><path d="M 225 240 V 209 H 667 V 240" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#green)"/><path d="M 850 293 H 824 V 420 H 667 V 335" fill="none" stroke="#086fa0" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 895 335 V 468 H 412 V 335" fill="none" stroke="#086fa0" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/><text x="35" y="528" font-size="24" fill="#192c3b" text-anchor="start" font-weight="700">A compatible decoding order</text><rect x="85" y="572" width="145" height="95" rx="8" fill="#f6fafc" stroke="#086fa0" stroke-width="1.8"/><text x="157.5" y="603" font-size="22" fill="#086fa0" text-anchor="middle" font-weight="700">I0</text><line x1="230" y1="620" x2="340" y2="620" stroke="#192c3b" stroke-width="2" marker-end="url(#ink)"/><rect x="340" y="572" width="145" height="95" rx="8" fill="#f6fafc" stroke="#086fa0" stroke-width="1.8"/><text x="412.5" y="603" font-size="22" fill="#086fa0" text-anchor="middle" font-weight="700">P3</text><line x1="485" y1="620" x2="595" y2="620" stroke="#192c3b" stroke-width="2" marker-end="url(#ink)"/><rect x="595" y="572" width="145" height="95" rx="8" fill="#f6fafc" stroke="#b85d13" stroke-width="1.8"/><text x="667.5" y="603" font-size="22" fill="#b85d13" text-anchor="middle" font-weight="700">B1</text><line x1="740" y1="620" x2="850" y2="620" stroke="#192c3b" stroke-width="2" marker-end="url(#ink)"/><rect x="850" y="572" width="145" height="95" rx="8" fill="#f6fafc" stroke="#b85d13" stroke-width="1.8"/><text x="922.5" y="603" font-size="22" fill="#b85d13" text-anchor="middle" font-weight="700">B2</text><text x="35" y="735" font-size="19" fill="#536777" text-anchor="start" font-weight="400">B1 and B2 need I0 and P3 in this example, so P3 must be decoded before them.</text><text x="35" y="765" font-size="19" fill="#536777" text-anchor="start" font-weight="400">Display order and decode order can differ; presentation timestamps restore the intended order.</text><text x="35" y="795" font-size="19" fill="#536777" text-anchor="start" font-weight="400">Here the B pictures are not references. Modern codecs can also use B pictures as references.</text><text x="35" y="825" font-size="19" fill="#536777" text-anchor="start" font-weight="400">This four-picture pattern is a teaching example, not a requirement for every codec or file.</text></svg>
