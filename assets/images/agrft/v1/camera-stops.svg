<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="740" viewBox="0 0 1080 740" role="img" aria-labelledby="title desc"><title id="title">A stop changes area by a factor of two</title><desc id="desc">Four precisely area-scaled circular entrance pupils at constant focal length corresponding to f two, f two point eight, f four and f five point six, with relative areas one one-half one-quarter one-eighth.</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#192c3b"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#086fa0"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85d13"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#74479a"/></marker></defs><style>text{font-family:Arial,DejaVu Sans,sans-serif}path,line{stroke-linecap:round}</style><rect width="1080" height="740" fill="white"/><text x="35" y="44" font-size="28" fill="#192c3b" text-anchor="start" font-weight="700">A stop changes area by a factor of two</text><text x="35" y="84" font-size="19" fill="#536777" text-anchor="start" font-weight="400">Same focal length. Each full stop halves entrance-pupil area and ideal irradiance.</text><circle cx="155" cy="305" r="96" fill="#bfdfed" stroke="#086fa0" stroke-width="2.3"/><text x="155" y="168" font-size="28" fill="#086fa0" text-anchor="middle" font-weight="700">f/2</text><text x="155" y="462" font-size="22" fill="#192c3b" text-anchor="middle" font-weight="700">area 1</text><text x="155" y="501" font-size="20" fill="#536777" text-anchor="middle" font-weight="400">reference</text><circle cx="410" cy="305" r="67.88225099390856" fill="#aed5df" stroke="#086fa0" stroke-width="2.3"/><text x="410" y="168" font-size="28" fill="#086fa0" text-anchor="middle" font-weight="700">f/2.8</text><text x="410" y="462" font-size="22" fill="#192c3b" text-anchor="middle" font-weight="700">area 1/2</text><text x="410" y="501" font-size="20" fill="#536777" text-anchor="middle" font-weight="400">−1 stop</text><circle cx="665" cy="305" r="47.99999999999999" fill="#9dcbd0" stroke="#086fa0" stroke-width="2.3"/><text x="665" y="168" font-size="28" fill="#086fa0" text-anchor="middle" font-weight="700">f/4</text><text x="665" y="462" font-size="22" fill="#192c3b" text-anchor="middle" font-weight="700">area 1/4</text><text x="665" y="501" font-size="20" fill="#536777" text-anchor="middle" font-weight="400">−2 stops</text><circle cx="920" cy="305" r="33.94112549695427" fill="#8fc1be" stroke="#086fa0" stroke-width="2.3"/><text x="920" y="168" font-size="28" fill="#086fa0" text-anchor="middle" font-weight="700">f/5.6</text><text x="920" y="462" font-size="22" fill="#192c3b" text-anchor="middle" font-weight="700">area 1/8</text><text x="920" y="501" font-size="20" fill="#536777" text-anchor="middle" font-weight="400">−3 stops</text><text x="35" y="573" font-size="20" fill="#536777" text-anchor="start" font-weight="400">N = f / D, where D is entrance-pupil diameter. One stop multiplies N by √2.</text><text x="35" y="605" font-size="20" fill="#536777" text-anchor="start" font-weight="400">The circles are the entrance pupil as seen through the front optics, not bare iris blades.</text><text x="35" y="637" font-size="20" fill="#536777" text-anchor="start" font-weight="400">Labels 2.8 and 5.6 are conventionally rounded; the area construction uses exact √2 ratios.</text><text x="35" y="669" font-size="20" fill="#536777" text-anchor="start" font-weight="400">Transmission adds another factor: T = N / √τ. T-stops include the lens’s transmitted fraction τ.</text></svg>
